<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مختبرُ التغيّرِ</title>
<style>
:root{
  --navy:#200058; --muted:#5f5a85; --ink:#200058;
  --cyan:#00c3fe; --cyan-d:#0a8fc0; --cyan-l:#e3f8ff; --cyan-b:#b8ebff;
  --green:#12a06a; --green-d:#0b7a50; --green-l:#e4f6ee; --green-b:#9cd9bd;
  --red:#e8425a; --red-d:#c22b43; --red-l:#fde8ec; --red-b:#f5b3bf;
  --yellow:#ffd15c; --orange:#f6a723; --yellow-l:#fff6dc;
  --purple:#7b5cff; --purple-l:#efeaff;
  --bg:#f1f0fb; --bg-2:#e3f8ff; --card:#fff; --line:#e0ddf0; --soft:#faf9fe;
  --sh:0 6px 18px rgba(32,0,88,.08); --sh-l:0 18px 50px rgba(32,0,88,.16);
  --font:"Segoe UI","Noto Sans Arabic","Noto Naskh Arabic","Geeza Pro","Arial",Tahoma,system-ui,sans-serif;
  --nav-h:68px;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;min-height:100vh;font-family:var(--font);color:var(--ink);line-height:1.65;
  background:linear-gradient(180deg,var(--bg) 0%,var(--bg-2) 100%) fixed;}
button,input{font-family:inherit;color:inherit;}
:focus-visible{outline:3px solid var(--cyan);outline-offset:3px;border-radius:8px;}

/* ---------- header: title + 3 scene pills ---------- */
.hdr{max-width:1180px;margin:0 auto;padding:12px 16px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.hdr h1{margin:0;font-size:clamp(19px,2.6vw,25px);font-weight:900;line-height:1.3;flex:1;min-width:180px;}
.ref{font-size:12.5px;font-weight:700;color:var(--cyan-d);background:var(--cyan-l);border:1.5px solid var(--cyan-b);border-radius:999px;padding:4px 12px;white-space:nowrap;}
.pills{display:flex;gap:6px;list-style:none;margin:0;padding:0;}
.pills li{display:flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:999px;font-weight:800;font-size:14px;
  background:#fff;border:2px solid var(--line);color:var(--muted);transition:all .25s;white-space:nowrap;}
.pills li b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-size:13px;}
.pills li.on{border-color:var(--navy);color:var(--navy);box-shadow:0 0 0 3px rgba(32,0,88,.08);}
.pills li.on b{background:var(--navy);color:#fff;}
.pills li.done{border-color:var(--green-b);color:var(--green-d);}
.pills li.done b{background:var(--green);color:#fff;}

/* ---------- scene layout ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:12px 16px calc(var(--nav-h) + 18px);}
.scene{display:none;}
.scene.on{display:block;animation:rise .35s ease both;}
.layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:16px;align-items:start;}
.viewport{position:relative;border-radius:24px;overflow:hidden;background:#fff;box-shadow:var(--sh-l);min-height:420px;}
.viewport.dark{background:radial-gradient(ellipse at 50% 38%,#33197a 0%,#170040 72%);}
.v3d{position:relative;width:100%;aspect-ratio:4/3;touch-action:none;cursor:grab;}
.v3d canvas{display:block;width:100%;height:100%;}
.v3d .rot{position:absolute;bottom:10px;inset-inline-start:10px;font-size:12.5px;font-weight:800;color:#e8e3ff;background:rgba(255,255,255,.12);
  border-radius:999px;padding:4px 12px;pointer-events:none;}
.viewport:not(.dark) .v3d .rot{color:var(--muted);background:rgba(32,0,88,.06);}
.vtools{position:absolute;top:10px;inset-inline-end:10px;display:flex;gap:6px;z-index:3;flex-wrap:wrap;justify-content:flex-end;}

/* ---------- the guide card (one place to look) ---------- */
.guide{background:#fff;border-radius:24px;box-shadow:var(--sh-l);padding:16px 16px 14px;position:sticky;top:12px;}
.g-trail{display:flex;gap:6px;align-items:center;margin-bottom:10px;}
.g-trail i{flex:1;height:8px;border-radius:99px;background:#ece9f8;transition:background .3s;}
.g-trail i.done{background:var(--green);} .g-trail i.cur{background:var(--cyan);}
.g-count{font-size:13px;font-weight:800;color:var(--muted);margin-bottom:4px;}
.g-step{display:flex;gap:12px;align-items:flex-start;}
.g-num{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--navy);color:#fff;font-weight:900;font-size:20px;}
.g-text{margin:0;font-size:clamp(18px,2.1vw,21px);font-weight:900;line-height:1.45;padding-top:6px;}
.g-body{margin-top:12px;}
.g-body:empty{display:none;}
.g-book{margin-top:12px;border-top:1.5px dashed var(--line);padding-top:8px;}
.g-book summary{cursor:pointer;font-weight:800;font-size:14px;color:var(--purple);list-style:none;min-height:36px;display:flex;align-items:center;gap:6px;}
.g-book summary::-webkit-details-marker{display:none;}
.g-book p{margin:6px 0 0;font-size:15px;background:var(--purple-l);border-radius:12px;padding:8px 12px;}
.g-book .extra{background:var(--soft);color:var(--muted);font-size:13.5px;border:1.5px dashed var(--line);}
.g-book .extra::before{content:"ℹ️ توضيحٌ للنشاطِ وليس من الكتابِ: ";font-weight:800;}
.g-done{text-align:center;padding:8px 0 2px;}
.g-done .big{font-size:44px;line-height:1;animation:pop .5s ease both;}
.g-done h3{margin:6px 0 4px;font-size:21px;font-weight:900;}
.g-done ul{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:6px;text-align:start;}
.g-done li{background:var(--green-l);border:1.5px solid var(--green-b);border-radius:12px;padding:7px 12px;font-weight:700;font-size:15px;}

/* ---------- controls ---------- */
.btn{min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 20px;border-radius:999px;border:2px solid transparent;
  font-size:16px;font-weight:800;cursor:pointer;background:var(--navy);color:#fff;transition:transform .12s,background .2s,box-shadow .2s;touch-action:manipulation;user-select:none;}
.btn:active{transform:scale(.96);} .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
.btn.cyan{background:var(--cyan);color:var(--navy);} .btn.green{background:var(--green);} .btn.red{background:var(--red);}
.btn.ghost{background:#fff;color:var(--navy);border-color:var(--line);}
.btn.ghost[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy);}
.btn.sm{min-height:40px;font-size:14.5px;padding:0 14px;}
.btn.glow{animation:glow 1.4s ease-in-out infinite;}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.choices{display:grid;gap:8px;}
.choice{min-height:52px;text-align:start;padding:8px 14px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:16.5px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:10px;}
.choice:hover{border-color:var(--cyan);}
.choice.ok{border-color:var(--green);background:var(--green-l);} .choice.bad{border-color:var(--red);background:var(--red-l);animation:shake .4s;}
.counter{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--soft);border:1.5px solid var(--line);border-radius:16px;padding:6px 8px 6px 12px;}
.counter .n{font-size:24px;font-weight:900;min-width:34px;text-align:center;}
input[type=range]{width:100%;height:44px;accent-color:var(--cyan-d);cursor:pointer;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{min-height:46px;display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;background:#fff;border:2px solid var(--cyan-b);
  font-weight:800;font-size:15.5px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 3px 0 var(--cyan-b);}
.chip.sel{border-color:var(--navy);box-shadow:0 0 0 4px rgba(0,195,254,.35);}
.chip.dragging{opacity:.35;} .chip.ghost{position:fixed;z-index:999;pointer-events:none;transform:rotate(-3deg) scale(1.05);box-shadow:var(--sh-l);}
.chip.ok{border-color:var(--green);background:var(--green-l);box-shadow:0 3px 0 var(--green-b);cursor:default;} .chip.bad{border-color:var(--red);background:var(--red-l);animation:shake .4s;}
.zone{min-height:62px;border:2.5px dashed var(--cyan-b);border-radius:16px;padding:8px;background:#fff;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;transition:background .15s,border-color .15s;}
.zone.hot{background:var(--cyan-l);border-color:var(--cyan);border-style:solid;}
.zone .zt{width:100%;font-weight:900;font-size:15px;}
.tag{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:14px;border-radius:999px;padding:3px 12px;background:var(--soft);border:1.5px solid var(--line);}
.tag.ok{background:var(--green-l);border-color:var(--green-b);color:var(--green-d);} .tag.bad{background:var(--red-l);border-color:var(--red-b);color:var(--red-d);}

/* feedback (inside the guide card) */
.fb{display:none;margin-top:10px;border-radius:14px;padding:10px 12px;font-size:15.5px;font-weight:700;border:2px solid;animation:rise .25s ease both;}
.fb.show{display:flex;gap:8px;align-items:flex-start;}
.fb .ic{font-size:20px;line-height:1.3;flex:none;}
.fb.ok{background:var(--green-l);border-color:var(--green-b);color:#064b31;}
.fb.bad{background:var(--red-l);border-color:var(--red-b);color:#7a1426;}
.fb.info{background:var(--cyan-l);border-color:var(--cyan-b);color:#06456a;}
.fb.warn{background:var(--yellow-l);border-color:#f3dc97;color:#5a4200;}

/* spotlight ring + pointing hand */
#spot{position:fixed;z-index:60;pointer-events:none;border-radius:50%;border:4px solid var(--yellow);box-shadow:0 0 0 6px rgba(255,209,92,.35),0 0 24px rgba(255,209,92,.8);
  display:none;animation:ring 1.3s ease-in-out infinite;transition:left .25s,top .25s,width .25s,height .25s;}
#spot.box{border-radius:18px;}
#hand{position:fixed;z-index:61;pointer-events:none;font-size:34px;display:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3));animation:tapme 1.3s ease-in-out infinite;transition:left .25s,top .25s;}

/* nav */
.navbar{position:fixed;bottom:0;left:0;right:0;z-index:50;height:var(--nav-h);background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-top:1.5px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));}
.navbar .in{max-width:1180px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:space-between;height:100%;}
.navbar .where{font-weight:800;color:var(--muted);font-size:14px;text-align:center;flex:1;}

.confetti{position:fixed;inset:0;pointer-events:none;z-index:998;}
@keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
@keyframes shake{0%,100%{transform:none;}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
@keyframes pop{0%{transform:scale(.5);opacity:0;}70%{transform:scale(1.12);}100%{transform:scale(1);opacity:1;}}
@keyframes ring{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.12);opacity:.75;}}
@keyframes tapme{0%,100%{transform:translate(0,0);}50%{transform:translate(-4px,-8px);}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(0,195,254,.6);}50%{box-shadow:0 0 0 10px rgba(0,195,254,0);}}

/* phone: one screen, no overlap — header, model (top), guide (fills the rest, scrolls inside), nav */
@media (max-width:820px){
  body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;}
  .hdr{padding:8px 10px 0;gap:8px;flex:none;} .hdr h1{font-size:18px;min-width:0;} .ref{display:none;}
  .pills li{height:34px;padding:0 9px;font-size:13px;} .pills li span{display:none;}
  .wrap{flex:1;min-height:0;width:100%;padding:8px 8px calc(var(--nav-h) + 8px);}
  .scene.on{height:100%;}
  .layout{display:flex;flex-direction:column;height:100%;gap:8px;align-items:stretch;}
  .viewport{flex:0 0 auto;min-height:0;border-radius:18px;}
  .v3d{aspect-ratio:auto;height:36vh;height:36dvh;min-height:200px;}
  .guide{position:static;flex:1 1 0;min-height:140px;overflow:auto;border-radius:18px;padding:12px;}
  .g-num{width:38px;height:38px;font-size:18px;border-radius:12px;} .g-text{font-size:17.5px;padding-top:4px;}
  .g-count{display:none;}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}}
</style>
<style>
/* ===== ACTIVITY CSS ===== */
.vtools .btn{box-shadow:0 4px 14px rgba(0,0,0,.2);}
.vtools .btn[hidden]{display:none;}
.eqf{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;background:var(--soft);border:1.5px solid var(--line);border-radius:16px;padding:8px;}
.eqf .slot{min-width:82px;min-height:54px;justify-content:center;align-items:center;padding:4px;flex:none;}
.eqf .slot .zt{font-size:12.5px;color:var(--muted);text-align:center;font-weight:800;line-height:1.3;}
.eqf .slot:has(.chip) .zt{display:none;}
.eqf .slot.cond{min-height:46px;border-color:#f3c46b;}
.eqf .arw{display:flex;flex-direction:column;align-items:center;gap:2px;}
.eqf .arw svg{width:84px;height:16px;}
.eqf .plus{font-size:24px;font-weight:900;}
.eqf .chip{font-size:14.5px;padding:4px 10px;min-height:42px;}
.sortz{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
.sortz .zone{min-height:100px;}
.sortz .zt small{display:block;font-size:12.5px;color:var(--muted);font-weight:700;}
.g-body .chips{margin-top:8px;}
.eqmini{display:inline-block;direction:ltr;unicode-bidi:isolate;}
@media (max-width:820px){
  .eqf{gap:4px;padding:6px;} .eqf .slot{min-width:70px;min-height:48px;} .eqf .arw svg{width:64px;}
  .sortz .zone{min-height:80px;}
  .vtools .btn.sm{min-height:44px;}
}
</style>
</head>
<body>
<header class="hdr">
  <h1>🧪 مختبرُ التغيّرِ</h1>
  <span class="ref">📘 الفصلُ ٦: التفاعلاتُ الكيميائيةُ · الدرسانِ ١–٢ · كتابُ النشاطِ ص ٤٣–٤٥</span>
  <ol class="pills" id="pills" aria-label="أجزاءُ النشاطِ"></ol>
</header>

<div class="wrap">
  <section class="scene" data-scene="0">
    <div class="layout">
      <div class="viewport"><div class="v3d" id="view0"></div>
        <div class="vtools"><button class="btn cyan sm" id="stirBtn" type="button" disabled>🥄 حرّكْ</button></div>
      </div>
      <aside class="guide"></aside>
    </div>
  </section>

  <section class="scene" data-scene="1">
    <div class="layout">
      <div class="viewport dark"><div class="v3d" id="view1"></div>
        <div class="vtools">
          <button class="btn red sm" id="flameBtn" type="button">🔥 أشعلِ اللهبَ</button>
          <button class="btn cyan sm" id="cupBtn" type="button" hidden>🥛 ضعِ القدحَ</button>
          <button class="btn red sm" id="goBtn" type="button" hidden>🔥 تابعِ التسخينَ</button>
        </div>
      </div>
      <aside class="guide"></aside>
    </div>
  </section>

  <section class="scene" data-scene="2">
    <div class="layout">
      <div class="viewport"><div class="v3d" id="view2"></div></div>
      <aside class="guide"></aside>
    </div>
  </section>
</div>

<nav class="navbar" aria-label="التنقلُ">
  <div class="in">
    <button class="btn ghost" id="prevBtn" type="button">→ السابقُ</button>
    <div class="where" id="where"></div>
    <button class="btn" id="nextBtn" type="button">التالي ←</button>
  </div>
</nav>
<div id="spot" aria-hidden="true"></div><div id="hand" aria-hidden="true">👆</div>

<script>
/* =====================================================================
   KIT v2
   Scenes & guided steps:
     Kit.scene(i, { title:'أستكشفُ', book:'<p>…</p><p class="extra">…</p>', summary:['…'], steps:[ STEP, … ] })
     STEP = { text:'اضغطْ على النواةِ', target: '#sel' | element | ()=>({x,y,r}) (client coords) | null,
              body: html string | (el)=>{} , enter(){}, check(){ return true when done }, after:'feedback html shown when done' }
     Kit.start()            begin
     Kit.ping()             re-check current step now (call after any state change)
     Kit.next()             force-advance current step
     Kit.say(html,type)     feedback in the current guide card ('ok'|'bad'|'info'|'warn')
     Kit.tries(key)         counts wrong tries; returns the count (use to reveal "أرني الحلَّ" after 2)
   3D:
     const V = Kit.view3d(el, { draw(R,t){…}, onPick(id,hit){…}, yaw, pitch, zoom, auto:false, dist })
       R.sphere([x,y,z], r, '#hex', {id, label, labelColor, alpha})
       R.cyl([x,y,z],[x,y,z], r, '#hex', {id, alpha})          (rod / bond / bone)
       R.mesh(mesh, {pos,rot,scale}, {id, color:'#hex'|fn(c,n), alpha, doubleSided})
       R.line(a,b,'#hex',width,{dash,glow})   R.poly([p…],'#hex',width,{closed,dash,glow})   R.text(p,'نص',{color,size,bg})
       R.shadow([x,y,z], rx, rz)
       V.screen([x,y,z]) -> client {x,y}   V.cam (yaw,pitch,zoom)   V.redraw()
     Kit.mesh.ellipsoid({rx,ry,rz,seg,ring, bump:(u,v)=>k})  Kit.mesh.surface(fn(u,v)->[x,y,z], uSeg, vSeg, {closedU})
     Kit.mesh.box(w,h,d)   Kit.mesh.lathe(profile[[r,y]…], seg)
   Misc: Kit.ar(n) Arabic digits · Kit.dnd({chips,zones,accept,onDrop}) · Kit.celebrate() · Kit.toast(msg) · Kit.reduced
   ===================================================================== */
const Kit = (() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = (s, r=document) => r.querySelector(s), $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
  const AR='٠١٢٣٤٥٦٧٨٩', ar = n => String(n).replace(/[0-9]/g, d => AR[d]);
  const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };

  /* ---------------- scenes + guided steps ---------------- */
  const S=[]; let cur=0, step=0, timer=null, advancing=false; const tryCount={};
  function scene(i,cfg){ S[i]=Object.assign({done:false},cfg); }
  function start(){
    const pills=$('#pills'); pills.innerHTML='';
    S.forEach((s,i)=>{ const li=document.createElement('li'); li.innerHTML='<b>'+ar(i+1)+'</b><span>'+s.title+'</span>'; li.title=s.title; pills.appendChild(li); });
    $('#prevBtn').onclick=()=>goScene(cur-1); $('#nextBtn').onclick=()=>goScene(cur+1);
    addEventListener('resize',placeSpot); addEventListener('scroll',placeSpot,{passive:true});
    (function spotLoop(){ placeSpot(); requestAnimationFrame(spotLoop); })();
    goScene(0,true);
  }
  function goScene(i,first){
    if(i<0||i>=S.length) return;
    if(!first && i>cur && !S[cur].done){ toast('أكملْ خطواتِ هذا الجزءِ أولاً 👆'); return; }
    cur=i; $$('.scene').forEach((el,k)=>el.classList.toggle('on',k===i));
    $$('#pills li').forEach((li,k)=>{ li.classList.toggle('on',k===i); li.classList.toggle('done',S[k].done&&k!==i); });
    $('#prevBtn').disabled=i===0; $('#nextBtn').style.visibility=i===S.length-1?'hidden':'visible';
    $('#where').textContent='الجزءُ '+ar(i+1)+' من '+ar(S.length);
    if(!first) scrollTo({top:0,behavior:reduced?'auto':'smooth'});
    S[i].enter&&S[i].enter();
    if(S[i].done) showDone(); else goStep(0);
    updateNext();
  }
  function card(){ return $$('.scene')[cur].querySelector('.guide'); }
  function goStep(k){
    step=k; advancing=false; const s=S[cur], st=s.steps[k], g=card();
    const trail=s.steps.map((_,j)=>'<i class="'+(j<k?'done':j===k?'cur':'')+'"></i>').join('');
    g.innerHTML='<div class="g-trail">'+trail+'</div><div class="g-count">الخطوةُ '+ar(k+1)+' من '+ar(s.steps.length)+'</div>'+
      '<div class="g-step"><span class="g-num">'+ar(k+1)+'</span><p class="g-text">'+st.text+'</p></div><div class="g-body"></div><div class="fb"></div>'+
      (s.book?'<details class="g-book"><summary>📘 من الكتابِ</summary>'+s.book+'</details>':'');
    const body=g.querySelector('.g-body');
    if(typeof st.body==='string') body.innerHTML=st.body; else if(typeof st.body==='function') st.body(body);
    st.enter&&st.enter();
    clearInterval(timer); timer=setInterval(ping,300);
  }
  function ping(){
    const s=S[cur]; if(!s||s.done||advancing) return; const st=s.steps[step];
    if(st && st.check && st.check()) next();
  }
  function next(){
    const s=S[cur]; if(advancing||s.done) return; advancing=true; const st=s.steps[step];

/* ---------- shared helpers ---------- */
const M=Kit.mesh, PI=Math.PI;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)), lerp=(a,b,k)=>a+(b-a)*k;
function mixHex(a,b,k){ const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)), A=p(a), B=p(b);
  return '#'+A.map((v,i)=>Math.round(lerp(v,B[i],clamp(k))).toString(16).padStart(2,'0')).join(''); }
function rnd(seed){ return ()=>{ seed=(seed*16807)%2147483647; return (seed-1)/2147483646; }; }
const CUBE=M.box(1,1,1);
/* table/bench slab: box sides + a subdivided top so the painter's sort keeps objects on top of it */
function slab(w,h,d,nx=12,nz=6){ const b=M.box(w,h,d), top=M.surface((u,v)=>[(u-.5)*w,h/2,(v-.5)*d],nx,nz), n=b.v.length;
  return {v:b.v.concat(top.v), f:b.f.filter((_,i)=>i!==6&&i!==7).concat(top.f.map(f=>f.map(k=>k+n)))}; }
function crystal(R,p,s,rot,op={}){ if(s<.4) return; R.mesh(CUBE,{pos:p,rot,scale:s},Object.assign({color:'#ffffff',doubleSided:true},op)); }
function elRect(sel){ const e=Kit.$(sel); if(!e||e.hidden||e.offsetParent===null) return null; const b=e.getBoundingClientRect(); return {x:b.left+b.width/2,y:b.top+b.height/2,w:b.width+14,h:b.height+14,box:true}; }
const gBody=()=>document.querySelector('.scene.on .g-body');
const quizOk=()=>{ const b=gBody(); return !!b&&b.dataset.ok==='1'; };
/* one-question quiz: opts [{t, ok, why}] — wrong: explain; after 2 wrong tries the solution is shown */
function quiz(el,opts,key,onOk){
  el.innerHTML='<div class="choices">'+opts.map((o,i)=>'<button class="choice" type="button" data-i="'+i+'">'+o.t+'</button>').join('')+'</div>';
  const good=opts.find(o=>o.ok);
  el.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{ if(el.dataset.ok) return; const o=opts[+b.dataset.i];
    if(o.ok){ b.classList.add('ok'); el.dataset.ok='1'; onOk&&onOk(); Kit.ping(); }
    else { b.classList.remove('bad'); void b.offsetWidth; b.classList.add('bad'); const n=Kit.tries(key);
      Kit.say('حاولْ مرةً أخرى — '+o.why+(n>=2?'<br><b>الحلُّ:</b> '+good.t+' — '+good.why:''),'bad'); } });
}

/* ================= Scene 1: sugar in tea ================= */
const Y0=-80, GX=70, BX=-130;              // table top, glass x, sugar-bowl x
const tableM=slab(520,18,260), saucerM=M.ellipsoid({rx:62,ry:5,rz:62,seg:20,ring:6});
const glassM=M.lathe([[0,2],[22,2],[25,6],[16,45],[20,75],[34,125],[38,135]],20);
const teaM=M.lathe([[0,5],[19,5],[14,45],[18,75],[30,110],[0,110]],20);
const bowlM=M.lathe([[0,0],[18,0],[36,22],[44,46],[46,49]],20), heapM=M.ellipsoid({rx:40,ry:12,rz:40,seg:16,ring:8});
const spoonM=M.ellipsoid({rx:13,ry:4,rz:9,seg:14,ring:8});
const r1=rnd(7), CR=Array.from({length:9},()=>({x:(r1()-.5)*22,z:(r1()-.5)*22,rot:[r1()*3,r1()*3,r1()*3],a:r1()*6.3,d:r1()}));
const T={phase:0,k:0,fall:0,dis:0,stir:false,mix:false};   // phase 0 in bowl · 1 moving · 2 falling · 3 in tea
function spoonAt(t){
  const rest={b:[BX+4,Y0+54,0],h:[BX+58,Y0+108,14]}, over={b:[GX-6,Y0+168,0],h:[GX+46,Y0+214,0]};
  if(T.phase===0) return rest;
  if(T.phase===1){ const k=T.k, lift=Math.sin(k*PI)*60; return {b:[lerp(rest.b[0],over.b[0],k),lerp(rest.b[1],over.b[1],k)+lift,0],h:[lerp(rest.h[0],over.h[0],k),lerp(rest.h[1],over.h[1],k)+lift,0]}; }
  if(T.phase===2) return over;
  const a=T.stir?t/180:0.6, rr=T.stir?9:4; return {b:[GX+Math.cos(a)*rr,Y0+30,Math.sin(a)*rr],h:[GX+18+Math.cos(a)*4,Y0+190,Math.sin(a)*4]};
}
const v0=Kit.view3d(Kit.$('#view0'),{yaw:.35,pitch:.32,zoom:1.3,
  draw(R,t){
    R.mesh(tableM,{pos:[0,Y0-9,0]},{color:'#d9a873'});
    R.shadow([GX,Y0+.5,0],56,46); R.shadow([BX,Y0+.5,0],44,40);
    R.mesh(saucerM,{pos:[GX,Y0+5,0]},{color:'#f3f1fb'});
    R.mesh(teaM,{pos:[GX,Y0+8,0]},{color:'#b0501c',alpha:.8});
    R.mesh(glassM,{pos:[GX,Y0+8,0]},{color:'#dff3ff',alpha:.28,doubleSided:true});
    R.mesh(bowlM,{pos:[BX,Y0,0]},{color:'#5aa2dc',doubleSided:true});
    R.mesh(heapM,{pos:[BX,Y0+46,0]},{color:'#ffffff'});
    // sugar crystals: falling, resting, dissolving
    if(T.phase>=2){ const sp=spoonAt(t).b;
      CR.forEach(c=>{ const f=T.phase===2?clamp(T.fall*1.3-c.d*.3):1, s=10*(1-T.dis);
        const sw=T.stir?t/300+c.a:0, rad=T.stir?3+c.d*5:0;
        const p=[lerp(sp[0]+c.x*.3,GX+c.x*.5+Math.cos(sw)*rad,f), lerp(sp[1],Y0+20+c.d*5,f*f), lerp(c.z*.3,c.z*.4+5+Math.sin(sw)*rad,f)];
        crystal(R,p,s,c.rot); }); }
    const sp=spoonAt(t);
    R.cyl(sp.b,sp.h,3.2,'#9aa6b2',{id:'spoon'});
    R.mesh(spoonM,{pos:sp.b,rot:[0,0,T.phase>=3?-1.2:0]},{id:'spoon',color:'#c5ced8',doubleSided:true});
    if(T.phase<=1) CR.slice(0,4).forEach((c,i)=>crystal(R,[sp.b[0]+c.x*.35,sp.b[1]+5,c.z*.3],6,c.rot,{id:'spoon'}));
    R.text([BX,Y0-34,40],'سكرُ المائدةِ',{size:14});
    R.text([GX,Y0+160,0],T.mix?'شايٌ + سكرٌ: مخلوطٌ متجانسٌ':'شايٌ',{size:14,bg:T.mix?'#e4f6ee':undefined,color:T.mix?'#0b7a50':undefined});
  },
  onPick(id){ if(id==='spoon') addSugar(); else if(id&&T.phase===3) stir(); }});
function anim(ms,fn,done){ if(Kit.reduced) ms=Math.min(ms,250); const t0=performance.now(); (function f(now){ const k=clamp((now-t0)/ms); fn(k); if(k<1) requestAnimationFrame(f); else done&&done(); })(t0); }
function addSugar(){
  if(T.phase!==0) return; T.phase=1;
  anim(800,k=>T.k=k,()=>{ T.phase=2; anim(700,k=>T.fall=k,()=>{ T.phase=3; Kit.$('#stirBtn').disabled=false; Kit.ping(); }); });
}
function stir(){
  if(T.phase!==3||T.stir||T.dis>=1) return; T.stir=true; Kit.$('#stirBtn').disabled=true;
  anim(2400,k=>T.dis=k,()=>{ T.stir=false; T.dis=1; Kit.ping(); });
}
Kit.$('#stirBtn').onclick=stir;

/* ================= Scene 2: heating sugar ================= */
const B=-150, TB=B+128, TT=TB+143;     // bench top, tube bottom, tube top
const benchM=slab(520,16,240), baseM=slab(170,14,90,6,3), lampM=M.lathe([[0,0],[34,0],[38,12],[34,40],[12,52],[9,58]],20);
const tubeM=M.lathe([[0,0],[8,1.5],[12,6],[13,14],[13,140],[15,143]],20);
const cupM=M.lathe([[0,0],[26,0],[28,2],[28,60],[31,62]],20);
const H={on:false,p:0,cupK:0,cupOn:false,meltDone:false,dropDone:false,go:false,end:false,drops:0};
const r2=rnd(11), SC=Array.from({length:10},()=>({x:(r2()-.5)*12,y:r2()*14,z:(r2()-.5)*12,rot:[r2()*3,r2()*3,r2()*3]}));
const DR=Array.from({length:14},()=>({a:r2()*PI*2,y:8+r2()*44,s:2.4+r2()*1.6}));
function cupTf(){ const k=H.cupK, lift=Math.sin(k*PI)*70;
  return {pos:[lerp(140,0,k),lerp(B,TT+66,k)+lift,lerp(-40,0,k)],rx:lerp(0,PI,k)}; }
function cupPoint(p){ const t=cupTf(), c=Math.cos(t.rx), s=Math.sin(t.rx); return [p[0]+t.pos[0], p[1]*c-p[2]*s+t.pos[1], p[1]*s+p[2]*c+t.pos[2]]; }
function stuffColor(){ const p=H.p; return p<62?mixHex('#fbf3d6','#d99a2b',(p-30)/32):mixHex('#d99a2b','#1c1612',(p-62)/30); }
const v1=Kit.view3d(Kit.$('#view1'),{yaw:.45,pitch:.22,zoom:1.08,
  draw(R,t){
    R.mesh(benchM,{pos:[0,B-8,0]},{color:'#8a6a4a'});
    R.shadow([0,B+.5,0],44,40); if(H.cupK<.05) R.shadow([140,B+.5,-40],32,30);
    // stand
    R.mesh(baseM,{pos:[-50,B+7,0]},{color:'#9aa3b5'});
    R.cyl([-100,B+10,0],[-100,TT+20,0],4.5,'#b9c0cc');
    R.cyl([-100,TB+110,0],[-14,TB+110,0],3.5,'#b9c0cc'); R.cyl([-14,TB+110,-9],[-14,TB+110,9],3,'#7d8594');
    // burner + flame
    R.mesh(lampM,{pos:[0,B,0]},{id:'lamp',color:'#7fb6e8',alpha:.9,doubleSided:true});
    R.cyl([0,B+56,0],[0,B+66,0],3,'#f2efe6',{id:'lamp'});
    if(H.on){ const f=Kit.reduced?1:1+Math.sin(t/70)*.08+Math.sin(t/37)*.05;
      R.sphere([0,B+84,0],18*f,'#ff7a1a',{alpha:.45}); R.sphere([0,B+92,0],12*f,'#ffb21a',{alpha:.85});
      R.sphere([0,B+104*f,0],7,'#ffe27a',{alpha:.9}); R.sphere([0,B+80,0],7,'#5ab0ff',{alpha:.7}); }
    // tube contents
    const melt=clamp((H.p-12)/18), dark=clamp((H.p-62)/30);
    SC.forEach(c=>crystal(R,[c.x,TB+5+c.y*(1-melt*.8),c.z],5.5*(1-melt),c.rot));
    if(melt>0){ const h=lerp(3,16,melt)-dark*3; R.mesh(M.lathe([[0,1],[7.5,2.5],[11,7],[11.6,h],[0,h]],16),{pos:[0,TB,0]},{color:stuffColor(),doubleSided:true}); }
    R.mesh(tubeM,{pos:[0,TB,0]},{id:'tube',color:'#e6f6ff',alpha:.26,doubleSided:true});
    // vapour
    if(H.on&&H.p>=34&&H.p<98&&!Kit.reduced) for(let i=0;i<5;i++){ const k=((t/1400)+i/5)%1, top=H.cupOn?TT+52:TT+70;
      R.sphere([Math.sin(i*2+t/400)*5,lerp(TB+30,top,k),Math.cos(i*3)*4],5+k*4,'#ffffff',{alpha:.35*(1-k)}); }
    // cup + droplets
    const tf=cupTf(); R.mesh(cupM,{pos:tf.pos,rot:[tf.rx,0,0]},{id:'cup',color:'#e6f6ff',alpha:.3,doubleSided:true});
    for(let i=0;i<Math.floor(H.drops);i++){ const d=DR[i]; R.sphere(cupPoint([Math.cos(d.a)*26,d.y,Math.sin(d.a)*26]),d.s,'#5fd0ff',{alpha:.95}); }
    // labels (grow as the student discovers)
    R.text([95,B+55,0],'مصدرٌ حراريٌّ',{size:13});
    R.text([-55,TT-40,0],'أنبوبُ اختبارٍ',{size:13});
    const lab=H.end?'كاربونٌ':H.meltDone?'سكرٌ منصهرٌ':'سكرُ المائدةِ';
    R.text([62,TB+8,0],lab,{size:14,bg:H.end?'#2b2b2b':undefined,color:H.end?'#fff':undefined});
    R.text(cupPoint([0,H.cupK>.5?-18:84,0]),H.dropDone?'ماءٌ 💧':'قدحٌ',{size:14,bg:H.dropDone?'#e3f8ff':undefined});
  },
  onPick(id){ if(id==='lamp') light(); else if(id==='cup') placeCup(); }});
function tools(){ const show=(id,on)=>Kit.$(id).hidden=!on;
  show('#flameBtn',!H.on&&!H.meltDone&&H.p<30); show('#cupBtn',H.meltDone&&!H.cupOn&&!H.dropDone); show('#goBtn',H.dropDone&&!H.go); }
function light(){ if(H.on||H.end) return; H.on=true; tools(); Kit.ping(); }
function placeCup(){ if(!H.meltDone||H.cupOn||H.dropDone) return; H.cupOn=true; tools(); anim(900,k=>H.cupK=k); Kit.ping(); }
function goOn(){ if(!H.dropDone||H.go) return; H.go=true; H.cupOn=false; tools(); anim(900,k=>H.cupK=1-k); Kit.ping(); }
Kit.$('#flameBtn').onclick=light; Kit.$('#cupBtn').onclick=placeCup; Kit.$('#goBtn').onclick=goOn;
let lastT=performance.now();
setInterval(()=>{ const now=performance.now(), dt=(now-lastT)/1000; lastT=now; if(!H.on) return;
  const cap=!H.meltDone?30:!H.cupOn&&!H.dropDone?44:!H.dropDone?62:H.go?100:62;
  if(H.cupOn&&H.cupK<1) return;
  const rate=Kit.reduced?40:(H.go?13:10);
  H.p=Math.min(cap,H.p+rate*dt);
  if(H.cupOn&&H.p>44) H.drops=Math.max(H.drops,(H.p-44)/18*DR.length);
  if(H.p>=100){ H.on=false; H.end=true; tools(); Kit.ping(); }
},50);

const shelfM=slab(520,14,130,14,4);

    R.cyl([-120,0,0],[18,0,0],5,'#200058',{alpha:E.R||E.w||E.c?1:.5});
    R.mesh(headM,{pos:[16,0,0],rot:[0,0,-PI/2]},{color:'#200058',doubleSided:true,alpha:E.R||E.w||E.c?1:.5});
    if(E.C){ const f=Kit.reduced?1:1+Math.sin(t/80)*.08; R.sphere([-50,30,0],13*f,'#ff7a1a',{alpha:.55}); R.sphere([-50,36,0],8*f,'#ffd15c',{alpha:.9}); }
    else R.sphere([-50,30,0],10,'#ffb21a',{alpha:.2});
    R.mesh(dropM,{pos:[90,-8,0],scale:1.3},{color:'#38b6ff',alpha:E.w?.9:.2,doubleSided:true});
    R.mesh(lumpM,{pos:[210,-22,0],scale:1.25},{color:'#2b2b2b',alpha:E.c?1:.2});
    R.text([150,-6,0],'+',{size:30,bg:false,color:'#200058'});
    R.text([-190,-82,30],E.R?'سكرُ المائدةِ':'؟',{size:14});
    R.text([-50,66,0],E.C?'حرارةٌ':'؟',{size:14,bg:E.C?'#fff6dc':undefined});
    R.text([90,-82,30],E.w?'ماءٌ':'؟',{size:14}); R.text([210,-82,30],E.c?'كاربونٌ':'؟',{size:14});
    if(E.R) R.text([-190,90,0],'الموادُّ المتفاعلةُ',{size:12,bg:'#efeaff'});
    if(E.w&&E.c) R.text([150,90,0],'الموادُّ الناتجةُ',{size:12,bg:'#e4f6ee'});
  }});
const ARROW='<svg viewBox="0 0 100 16" aria-hidden="true"><line x1="2" y1="8" x2="88" y2="8" stroke="#200058" stroke-width="3"/><path d="M84,2 L98,8 L84,14Z" fill="#200058"/></svg>';
function eqWhy(r,s,t){
  if(r==='C') return '«'+t+'» ليستْ مادةً متفاعلةً ولا ناتجةً؛ إنها ما يحتاجُه التفاعلُ، فتُكتبُ فوقَ السهمِ.';
  if(s==='C') return 'فوقَ السهمِ نكتبُ ما يحتاجُه التفاعلُ (حرارةٌ…)، لا الموادَّ.';
  if(r==='R') return '«'+t+'» هو المادةُ المتفاعلةُ (قبلَ أن يتغيّرَ)، فمكانُه على يسارِ السهمِ.';
  return '«'+t+'» مادةٌ ناتجةٌ جديدةٌ؛ رأسُ السهمِ يشيرُ إلى الموادِّ الناتجةِ، فمكانُها على يمينِ السهمِ.';
}
const CARDS=[
  {id:'tea',t:'🍵 السكرُ في الشايِ',k:'phys',why:'مخلوطٌ متجانسٌ؛ لا تتكوّنُ موادُّ جديدةٌ.'},
  {id:'melt',t:'💧 انصهارُ السكرِ فقط',k:'phys',why:'ما زالَ سكراً؛ تغيّرتْ حالتُه فقط.'},
  {id:'black',t:'⚫ تسخينُ السكرِ حتى يسودَّ',k:'chem',why:'تحلّلَ السكرُ إلى ماءٍ وكاربونٍ: موادُّ جديدةٌ.'},
  {id:'rust',t:'🟤 صدأُ الحديدِ',k:'chem',why:'تتكوّنُ مادةٌ جديدةٌ — من أمثلةِ الكتابِ على التفاعلاتِ الكيميائيةِ في حياتِنا.'},
  {id:'wood',t:'🔥 احتراقُ الخشبِ',k:'chem',why:'الاحتراقُ تفاعلٌ بينَ أوكسجينِ الهواءِ والموادِّ، وتنتجُ موادُّ جديدةٌ.'},
  {id:'elec',t:'⚡ التحليلُ الكهربائيُّ للماءِ',k:'chem',why:'تحلّلَ الماءُ إلى أوكسجينٍ وهيدروجينٍ: موادُّ جديدةٌ.'}];
Kit.scene(2,{title:'أتحدّى',
  book:'<p>في المعادلةِ اللفظيةِ: الموادُّ المتفاعلةُ على <b>يسارِ</b> السهمِ، والناتجةُ على <b>يمينِه</b>، وما يحتاجُه التفاعلُ <b>فوقَ</b> السهمِ، و(+) بينَ أكثرَ من مادةٍ.</p><p>من التفاعلاتِ الكيميائيةِ في حياتِنا: صدأُ الحديدِ. والتحليلُ الكهربائيُّ يحلّلُ الماءَ إلى أوكسجينٍ وهيدروجينٍ.</p>',
  summary:['<span class="eqmini">سكرُ المائدةِ —حرارةٌ→ ماءٌ + كاربونٌ</span>','مادةٌ جديدةٌ ← <b>تفاعلٌ كيميائيٌّ</b>','لا مادةَ جديدةَ ← <b>تغيّرٌ فيزيائيٌّ</b>'],
  steps:[
    {text:'ابنِ المعادلةَ: ضعْ كلَّ بطاقةٍ في مكانِها',
      body(el){
        el.innerHTML='<div class="eqf" dir="ltr">'+
          '<div class="zone slot" data-r="R"><span class="zt">المتفاعلةُ</span></div>'+
          '<div class="arw"><div class="zone slot cond" data-r="C"><span class="zt">ما يحتاجُه</span></div>'+ARROW+'</div>'+
          '<div class="zone slot" data-r="P"><span class="zt">ناتجةٌ</span></div><span class="plus" aria-label="زائد">+</span><div class="zone slot" data-r="P"><span class="zt">ناتجةٌ</span></div></div>'+
          '<div class="chips">'+Kit.shuffle([['w','ماءٌ','P'],['s','سكرُ المائدةِ','R'],['h','حرارةٌ','C'],['c','كاربونٌ','P']]).map(c=>'<span class="chip" data-id="'+c[0]+'" data-r="'+c[2]+'">'+c[1]+'</span>').join('')+'</div>';
        let why='';
        Kit.dnd({chips:[...el.querySelectorAll('.chip')],zones:[...el.querySelectorAll('.zone')],
          accept(c,z){ if(z.querySelector('.chip')){ why='هذا المكانُ فيه بطاقةٌ؛ اخترْ مكاناً فارغاً.'; return false; }
            if(c.dataset.r===z.dataset.r) return true; why=eqWhy(c.dataset.r,z.dataset.r,c.textContent); return false; },
          onDrop(c,z,ok){ if(ok){ const k={s:'R',h:'C',w:'w',c:'c'}[c.dataset.id]; E[k]=true; Kit.say('✔️ أحسنتَ.','info'); }
            else { const n=Kit.tries('eq'); Kit.say('حاولْ مرةً أخرى — '+why+(n>=2?'<br><b>الحلُّ:</b> <span class="eqmini">سكرُ المائدةِ —حرارةٌ→ ماءٌ + كاربونٌ</span>':''),'bad'); } }}); },
      check(){ return E.R&&E.C&&E.w&&E.c; }, after:'المتفاعلُ يسارَ السهمِ، والناتجانِ يمينَه، و<b>الحرارةُ</b> فوقَه.'},
    {text:'ما نوعُ تفاعلِ تسخينِ السكرِ؟',
      body(el){ quiz(el,[{t:'احتراقٌ',why:'الاحتراقُ تفاعلٌ بينَ أوكسجينِ الهواءِ والموادِّ. هنا مادةٌ واحدةٌ (السكرُ) انقسمتْ إلى مادتينِ.'},
        {t:'اتحادٌ',why:'في الاتحادِ تكوّنُ مادتانِ أو أكثرُ مادةً واحدةً. هنا حدثَ العكسُ.'},
        {t:'تحلّلٌ (تفكّكٌ)',ok:true,why:'مادةٌ واحدةٌ (السكرُ) تفكّكتْ إلى مادتينِ: ماءٍ وكاربونٍ.'}],'type'); },
      check:quizOk, after:'<b>تحلّلٌ</b>: مادةٌ واحدةٌ (السكرُ) تفكّكتْ إلى مادتينِ.'},
    {text:'صنّفْ: هل تكوّنتْ مادةٌ جديدةٌ؟',
      body(el){
        el.innerHTML='<div class="chips">'+Kit.shuffle(CARDS).map(c=>'<span class="chip" data-id="'+c.id+'">'+c.t+'</span>').join('')+'</div>'+
          '<div class="sortz"><div class="zone" data-k="phys"><span class="zt">🔵 تغيّرٌ فيزيائيٌّ<small>لا مادةَ جديدةَ</small></span></div>'+
          '<div class="zone" data-k="chem"><span class="zt">🟠 تفاعلٌ كيميائيٌّ<small>مادةٌ جديدةٌ</small></span></div></div>';
        Kit.dnd({chips:[...el.querySelectorAll('.chip')],zones:[...el.querySelectorAll('.zone')],
          accept:(c,z)=>CARDS.find(x=>x.id===c.dataset.id).k===z.dataset.k,
          onDrop(c,z,ok){ const d=CARDS.find(x=>x.id===c.dataset.id), name=d.t.replace(/^\S+ /,'');
            if(ok){ Kit.say('✔️ '+name+': '+d.why,'info'); return; }
            const n=Kit.tries('sort');
            Kit.say('حاولْ مرةً أخرى — '+(d.k==='phys'?'في «'+name+'» لم تتكوّنْ مادةٌ جديدةٌ.':'في «'+name+'» تتكوّنُ مادةٌ جديدةٌ.')+
              (n>=2?'<br><b>الحلُّ:</b> «'+name+'» '+(d.k==='phys'?'تغيّرٌ فيزيائيٌّ':'تفاعلٌ كيميائيٌّ')+' — '+d.why:''),'bad'); }}); },
      check(){ return document.querySelectorAll('.scene.on .g-body .sortz .chip.ok').length===CARDS.length; },
      after:'إذا تكوّنتْ مادةٌ جديدةٌ فهو <b>تفاعلٌ كيميائيٌّ</b>؛ وإذا بقيتِ المادةُ كما هي فهو <b>تغيّرٌ فيزيائيٌّ</b>.'}
  ]});

Kit.start(); tools();
</script>
