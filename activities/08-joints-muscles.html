<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كيف أتحرّك؟</title>
<style>
:root{
  --navy:#200058; --muted:#5f5a85; --ink:#200058;
  --cyan:#00c3fe; --cyan-d:#0a8fc0; --cyan-l:#e3f8ff; --cyan-b:#b8ebff;
  --green:#12a06a; --green-d:#0b7a50; --green-l:#e4f6ee; --green-b:#9cd9bd;
  --red:#e8425a; --red-d:#c22b43; --red-l:#fde8ec; --red-b:#f5b3bf;
  --yellow:#ffd15c; --orange:#f6a723; --yellow-l:#fff6dc;
  --purple:#7b5cff; --purple-l:#efeaff;
  --bg:#f1f0fb; --bg-2:#e3f8ff; --card:#fff; --line:#e0ddf0; --soft:#faf9fe;
  --sh:0 6px 18px rgba(32,0,88,.08); --sh-l:0 18px 50px rgba(32,0,88,.16);
  --font:"Segoe UI","Noto Sans Arabic","Noto Naskh Arabic","Geeza Pro","Arial",Tahoma,system-ui,sans-serif;
  --nav-h:68px;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;min-height:100vh;font-family:var(--font);color:var(--ink);line-height:1.65;
  background:linear-gradient(180deg,var(--bg) 0%,var(--bg-2) 100%) fixed;}
button,input{font-family:inherit;color:inherit;}
:focus-visible{outline:3px solid var(--cyan);outline-offset:3px;border-radius:8px;}

/* ---------- header: title + 3 scene pills ---------- */
.hdr{max-width:1180px;margin:0 auto;padding:12px 16px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.hdr h1{margin:0;font-size:clamp(19px,2.6vw,25px);font-weight:900;line-height:1.3;flex:1;min-width:180px;}
.ref{font-size:12.5px;font-weight:700;color:var(--cyan-d);background:var(--cyan-l);border:1.5px solid var(--cyan-b);border-radius:999px;padding:4px 12px;white-space:nowrap;}
.pills{display:flex;gap:6px;list-style:none;margin:0;padding:0;}
.pills li{display:flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:999px;font-weight:800;font-size:14px;
  background:#fff;border:2px solid var(--line);color:var(--muted);transition:all .25s;white-space:nowrap;}
.pills li b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-size:13px;}
.pills li.on{border-color:var(--navy);color:var(--navy);box-shadow:0 0 0 3px rgba(32,0,88,.08);}
.pills li.on b{background:var(--navy);color:#fff;}
.pills li.done{border-color:var(--green-b);color:var(--green-d);}
.pills li.done b{background:var(--green);color:#fff;}

/* ---------- scene layout ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:12px 16px calc(var(--nav-h) + 18px);}
.scene{display:none;}
.scene.on{display:block;animation:rise .35s ease both;}
.layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:16px;align-items:start;}
.viewport{position:relative;border-radius:24px;overflow:hidden;background:#fff;box-shadow:var(--sh-l);min-height:420px;}
.viewport.dark{background:radial-gradient(ellipse at 50% 38%,#33197a 0%,#170040 72%);}
.v3d{position:relative;width:100%;aspect-ratio:4/3;touch-action:none;cursor:grab;}
.v3d canvas{display:block;width:100%;height:100%;}
.v3d .rot{position:absolute;bottom:10px;inset-inline-start:10px;font-size:12.5px;font-weight:800;color:#e8e3ff;background:rgba(255,255,255,.12);
  border-radius:999px;padding:4px 12px;pointer-events:none;}
.viewport:not(.dark) .v3d .rot{color:var(--muted);background:rgba(32,0,88,.06);}
.vtools{position:absolute;top:10px;inset-inline-end:10px;display:flex;gap:6px;z-index:3;flex-wrap:wrap;justify-content:flex-end;}

/* ---------- the guide card (one place to look) ---------- */
.guide{background:#fff;border-radius:24px;box-shadow:var(--sh-l);padding:16px 16px 14px;position:sticky;top:12px;}
.g-trail{display:flex;gap:6px;align-items:center;margin-bottom:10px;}
.g-trail i{flex:1;height:8px;border-radius:99px;background:#ece9f8;transition:background .3s;}
.g-trail i.done{background:var(--green);} .g-trail i.cur{background:var(--cyan);}
.g-count{font-size:13px;font-weight:800;color:var(--muted);margin-bottom:4px;}
.g-step{display:flex;gap:12px;align-items:flex-start;}
.g-num{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--navy);color:#fff;font-weight:900;font-size:20px;}
.g-text{margin:0;font-size:clamp(18px,2.1vw,21px);font-weight:900;line-height:1.45;padding-top:6px;}
.g-body{margin-top:12px;}
.g-body:empty{display:none;}
.g-book{margin-top:12px;border-top:1.5px dashed var(--line);padding-top:8px;}
.g-book summary{cursor:pointer;font-weight:800;font-size:14px;color:var(--purple);list-style:none;min-height:36px;display:flex;align-items:center;gap:6px;}
.g-book summary::-webkit-details-marker{display:none;}
.g-book p{margin:6px 0 0;font-size:15px;background:var(--purple-l);border-radius:12px;padding:8px 12px;}
.g-book .extra{background:var(--soft);color:var(--muted);font-size:13.5px;border:1.5px dashed var(--line);}
.g-book .extra::before{content:"ℹ️ توضيحٌ للنشاطِ وليس من الكتابِ: ";font-weight:800;}
.g-done{text-align:center;padding:8px 0 2px;}
.g-done .big{font-size:44px;line-height:1;animation:pop .5s ease both;}
.g-done h3{margin:6px 0 4px;font-size:21px;font-weight:900;}
.g-done ul{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:6px;text-align:start;}
.g-done li{background:var(--green-l);border:1.5px solid var(--green-b);border-radius:12px;padding:7px 12px;font-weight:700;font-size:15px;}

/* ---------- controls ---------- */
.btn{min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 20px;border-radius:999px;border:2px solid transparent;
  font-size:16px;font-weight:800;cursor:pointer;background:var(--navy);color:#fff;transition:transform .12s,background .2s,box-shadow .2s;touch-action:manipulation;user-select:none;}
.btn:active{transform:scale(.96);} .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
.btn.cyan{background:var(--cyan);color:var(--navy);} .btn.green{background:var(--green);} .btn.red{background:var(--red);}
.btn.ghost{background:#fff;color:var(--navy);border-color:var(--line);}
.btn.ghost[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy);}
.btn.sm{min-height:40px;font-size:14.5px;padding:0 14px;}
.btn.glow{animation:glow 1.4s ease-in-out infinite;}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.choices{display:grid;gap:8px;}
.choice{min-height:52px;text-align:start;padding:8px 14px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:16.5px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:10px;}
.choice:hover{border-color:var(--cyan);}
.choice.ok{border-color:var(--green);background:var(--green-l);} .choice.bad{border-color:var(--red);background:var(--red-l);animation:shake .4s;}
.counter{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--soft);border:1.5px solid var(--line);border-radius:16px;padding:6px 8px 6px 12px;}
.counter .n{font-size:24px;font-weight:900;min-width:34px;text-align:center;}
input[type=range]{width:100%;height:44px;accent-color:var(--cyan-d);cursor:pointer;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{min-height:46px;display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;background:#fff;border:2px solid var(--cyan-b);
  font-weight:800;font-size:15.5px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 3px 0 var(--cyan-b);}
.chip.sel{border-color:var(--navy);box-shadow:0 0 0 4px rgba(0,195,254,.35);}
.chip.dragging{opacity:.35;} .chip.ghost{position:fixed;z-index:999;pointer-events:none;transform:rotate(-3deg) scale(1.05);box-shadow:var(--sh-l);}
.chip.ok{border-color:var(--green);background:var(--green-l);box-shadow:0 3px 0 var(--green-b);cursor:default;} .chip.bad{border-color:var(--red);background:var(--red-l);animation:shake .4s;}
.zone{min-height:62px;border:2.5px dashed var(--cyan-b);border-radius:16px;padding:8px;background:#fff;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;transition:background .15s,border-color .15s;}
.zone.hot{background:var(--cyan-l);border-color:var(--cyan);border-style:solid;}
.zone .zt{width:100%;font-weight:900;font-size:15px;}
.tag{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:14px;border-radius:999px;padding:3px 12px;background:var(--soft);border:1.5px solid var(--line);}
.tag.ok{background:var(--green-l);border-color:var(--green-b);color:var(--green-d);} .tag.bad{background:var(--red-l);border-color:var(--red-b);color:var(--red-d);}

/* feedback (inside the guide card) */
.fb{display:none;margin-top:10px;border-radius:14px;padding:10px 12px;font-size:15.5px;font-weight:700;border:2px solid;animation:rise .25s ease both;}
.fb.show{display:flex;gap:8px;align-items:flex-start;}
.fb .ic{font-size:20px;line-height:1.3;flex:none;}
.fb.ok{background:var(--green-l);border-color:var(--green-b);color:#064b31;}
.fb.bad{background:var(--red-l);border-color:var(--red-b);color:#7a1426;}
.fb.info{background:var(--cyan-l);border-color:var(--cyan-b);color:#06456a;}
.fb.warn{background:var(--yellow-l);border-color:#f3dc97;color:#5a4200;}

/* spotlight ring + pointing hand */
#spot{position:fixed;z-index:60;pointer-events:none;border-radius:50%;border:4px solid var(--yellow);box-shadow:0 0 0 6px rgba(255,209,92,.35),0 0 24px rgba(255,209,92,.8);
  display:none;animation:ring 1.3s ease-in-out infinite;transition:left .25s,top .25s,width .25s,height .25s;}
#spot.box{border-radius:18px;}
#hand{position:fixed;z-index:61;pointer-events:none;font-size:34px;display:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3));animation:tapme 1.3s ease-in-out infinite;transition:left .25s,top .25s;}

/* nav */
.navbar{position:fixed;bottom:0;left:0;right:0;z-index:50;height:var(--nav-h);background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-top:1.5px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));}
.navbar .in{max-width:1180px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:space-between;height:100%;}
.navbar .where{font-weight:800;color:var(--muted);font-size:14px;text-align:center;flex:1;}

.confetti{position:fixed;inset:0;pointer-events:none;z-index:998;}
@keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
@keyframes shake{0%,100%{transform:none;}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
@keyframes pop{0%{transform:scale(.5);opacity:0;}70%{transform:scale(1.12);}100%{transform:scale(1);opacity:1;}}
@keyframes ring{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.12);opacity:.75;}}
@keyframes tapme{0%,100%{transform:translate(0,0);}50%{transform:translate(-4px,-8px);}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(0,195,254,.6);}50%{box-shadow:0 0 0 10px rgba(0,195,254,0);}}

/* phone: one screen, no overlap — header, model (top), guide (fills the rest, scrolls inside), nav */
@media (max-width:820px){
  body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;}
  .hdr{padding:8px 10px 0;gap:8px;flex:none;} .hdr h1{font-size:18px;min-width:0;} .ref{display:none;}
  .pills li{height:34px;padding:0 9px;font-size:13px;} .pills li span{display:none;}
  .wrap{flex:1;min-height:0;width:100%;padding:8px 8px calc(var(--nav-h) + 8px);}
  .scene.on{height:100%;}
  .layout{display:flex;flex-direction:column;height:100%;gap:8px;align-items:stretch;}
  .viewport{flex:0 0 auto;min-height:0;border-radius:18px;}
  .v3d{aspect-ratio:auto;height:36vh;height:36dvh;min-height:200px;}
  .guide{position:static;flex:1 1 0;min-height:140px;overflow:auto;border-radius:18px;padding:12px;}
  .g-num{width:38px;height:38px;font-size:18px;border-radius:12px;} .g-text{font-size:17.5px;padding-top:4px;}
  .g-count{display:none;}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}}
</style>
<style>
/* ===== ACTIVITY CSS ===== */
.bar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#fff;border-top:1.5px solid var(--line);}
.bar label{font-weight:800;font-size:14.5px;white-space:nowrap;}
.bar input{flex:1;min-width:0;}
.bar output{font-weight:900;font-size:15px;min-width:76px;text-align:center;background:var(--cyan-l);border-radius:999px;padding:3px 10px;color:var(--cyan-d);}
.jsel{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;}
.jsel .btn{flex-direction:column;gap:0;padding:4px 6px;min-height:56px;font-size:14.5px;line-height:1.3;border-radius:16px;}
.jsel .btn small{font-size:11.5px;font-weight:700;opacity:.8;}
.pad{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap;}
.pad .btn{min-width:48px;padding:0;font-size:18px;}
.pad .hint{font-size:13px;font-weight:700;color:var(--muted);flex:1;min-width:120px;}
.cnt{display:inline-block;margin-top:8px;font-weight:900;font-size:14.5px;background:var(--cyan-l);color:var(--cyan-d);border-radius:999px;padding:3px 12px;}
.cmds{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.cmds .btn{padding:0 10px;font-size:15.5px;}
.zones2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
.zones3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px;}
.zones3 .zt,.zones2 .zt{font-size:14px;}
@media (max-width:820px){
  #view1,#view2{height:29vh;height:29dvh;min-height:170px;}
  .bar{padding:4px 10px;gap:6px;} .bar label{font-size:12.5px;} .bar output{min-width:60px;font-size:13px;padding:2px 8px;}
  .jsel .btn{min-height:50px;font-size:13px;} .jsel .btn small{font-size:10.5px;}
  .pad{margin-top:6px;} .pad .btn{min-height:44px;min-width:44px;}
  .chip{min-height:44px;font-size:14.5px;padding:4px 12px;}
  .zone{min-height:54px;}
}
</style>
</head>
<body>
<header class="hdr">
  <h1>🦴 كيفَ أتحرّكُ؟</h1>
  <span class="ref">📘 الفصلُ ٣ · الدرسانِ ٢–٣: الجهازُ الهيكليُّ والعضليُّ · كتابُ النشاطِ ص ٢٣–٢٩</span>
  <ol class="pills" id="pills" aria-label="أجزاءُ النشاطِ"></ol>
</header>

<div class="wrap">
  <section class="scene" data-scene="0">
    <div class="layout">
      <div class="viewport dark"><div class="v3d" id="view0"></div></div>
      <aside class="guide"></aside>
    </div>
  </section>

  <section class="scene" data-scene="1">
    <div class="layout">
      <div class="viewport"><div class="v3d" id="view1"></div>
        <div class="bar"><label for="ang">📐 الزاويةُ بينَ الشريحتينِ</label><input type="range" id="ang" min="30" max="180" value="90" step="1"><output id="angOut">٩٠°</output></div>
      </div>
      <aside class="guide"></aside>
    </div>
  </section>

  <section class="scene" data-scene="2">
    <div class="layout">
      <div class="viewport dark"><div class="v3d" id="view2"></div>
        <div class="bar"><label for="bend">💪 ثنيُ الذراعِ</label><input type="range" id="bend" min="0" max="100" value="0" step="1"><output id="bendOut">ممدودةٌ</output></div>
      </div>
      <aside class="guide"></aside>
    </div>
  </section>
</div>

<nav class="navbar" aria-label="التنقلُ">
  <div class="in">
    <button class="btn ghost" id="prevBtn" type="button">→ السابقُ</button>
    <div class="where" id="where"></div>
    <button class="btn" id="nextBtn" type="button">التالي ←</button>
  </div>
</nav>
<div id="spot" aria-hidden="true"></div><div id="hand" aria-hidden="true">👆</div>

<script>
/* =====================================================================
   KIT v2
   Scenes & guided steps:
     Kit.scene(i, { title:'أستكشفُ', book:'<p>…</p><p class="extra">…</p>', summary:['…'], steps:[ STEP, … ] })
     STEP = { text:'اضغطْ على النواةِ', target: '#sel' | element | ()=>({x,y,r}) (client coords) | null,
              body: html string | (el)=>{} , enter(){}, check(){ return true when done }, after:'feedback html shown when done' }
     Kit.start()            begin
     Kit.ping()             re-check current step now (call after any state change)
     Kit.next()             force-advance current step
     Kit.say(html,type)     feedback in the current guide card ('ok'|'bad'|'info'|'warn')
     Kit.tries(key)         counts wrong tries; returns the count (use to reveal "أرني الحلَّ" after 2)
   3D:
     const V = Kit.view3d(el, { draw(R,t){…}, onPick(id,hit){…}, yaw, pitch, zoom, auto:false, dist })
       R.sphere([x,y,z], r, '#hex', {id, label, labelColor, alpha})
       R.cyl([x,y,z],[x,y,z], r, '#hex', {id, alpha})          (rod / bond / bone)
       R.mesh(mesh, {pos,rot,scale}, {id, color:'#hex'|fn(c,n), alpha, doubleSided})
       R.line(a,b,'#hex',width,{dash,glow})   R.poly([p…],'#hex',width,{closed,dash,glow})   R.text(p,'نص',{color,size,bg})
       R.shadow([x,y,z], rx, rz)
       V.screen([x,y,z]) -> client {x,y}   V.cam (yaw,pitch,zoom)   V.redraw()
     Kit.mesh.ellipsoid({rx,ry,rz,seg,ring, bump:(u,v)=>k})  Kit.mesh.surface(fn(u,v)->[x,y,z], uSeg, vSeg, {closedU})
     Kit.mesh.box(w,h,d)   Kit.mesh.lathe(profile[[r,y]…], seg)
   Misc: Kit.ar(n) Arabic digits · Kit.dnd({chips,zones,accept,onDrop}) · Kit.celebrate() · Kit.toast(msg) · Kit.reduced
   ===================================================================== */
const Kit = (() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = (s, r=document) => r.querySelector(s), $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
  const AR='٠١٢٣٤٥٦٧٨٩', ar = n => String(n).replace(/[0-9]/g, d => AR[d]);
  const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };

  /* ---------------- scenes + guided steps ---------------- */
  const S=[]; let cur=0, step=0, timer=null, advancing=false; const tryCount={};
  function scene(i,cfg){ S[i]=Object.assign({done:false},cfg); }
  function start(){
    const pills=$('#pills'); pills.innerHTML='';
    S.forEach((s,i)=>{ const li=document.createElement('li'); li.innerHTML='<b>'+ar(i+1)+'</b><span>'+s.title+'</span>'; li.title=s.title; pills.appendChild(li); });
    $('#prevBtn').onclick=()=>goScene(cur-1); $('#nextBtn').onclick=()=>goScene(cur+1);
    addEventListener('resize',placeSpot); addEventListener('scroll',placeSpot,{passive:true});
    (function spotLoop(){ placeSpot(); requestAnimationFrame(spotLoop); })();
    goScene(0,true);
  }
  function goScene(i,first){
    if(i<0||i>=S.length) return;
    if(!first && i>cur && !S[cur].done){ toast('أكملْ خطواتِ هذا الجزءِ أولاً 👆'); return; }
    cur=i; $$('.scene').forEach((el,k)=>el.classList.toggle('on',k===i));
    $$('#pills li').forEach((li,k)=>{ li.classList.toggle('on',k===i); li.classList.toggle('done',S[k].done&&k!==i); });
    $('#prevBtn').disabled=i===0; $('#nextBtn').style.visibility=i===S.length-1?'hidden':'visible';
    $('#where').textContent='الجزءُ '+ar(i+1)+' من '+ar(S.length);
    if(!first) scrollTo({top:0,behavior:reduced?'auto':'smooth'});
    S[i].enter&&S[i].enter();
    if(S[i].done) showDone(); else goStep(0);
    updateNext();
  }
  function card(){ return $$('.scene')[cur].querySelector('.guide'); }
  function goStep(k){
    step=k; advancing=false; const s=S[cur], st=s.steps[k], g=card();
    const trail=s.steps.map((_,j)=>'<i class="'+(j<k?'done':j===k?'cur':'')+'"></i>').join('');
    g.innerHTML='<div class="g-trail">'+trail+'</div><div class="g-count">الخطوةُ '+ar(k+1)+' من '+ar(s.steps.length)+'</div>'+
      '<div class="g-step"><span class="g-num">'+ar(k+1)+'</span><p class="g-text">'+st.text+'</p></div><div class="g-body"></div><div class="fb"></div>'+

const M={th:90, out:false, sawOpen:false, sawClose:false, mapped:false};
const HX=30, HZ=70, LEN=210, NAIL=165;

const dir2=f=>[Math.cos(f),Math.sin(f)];
const plankM=Kit.mesh.box(LEN,12,42);
function nailPt(f,side,along,h){ const d=dir2(f), n=dir2(f+side*Math.PI/2); return W2(d[0]*along+n[0]*13,d[1]*along+n[1]*13,h); }
function drawBand(R,pts,col,r){ for(let i=0;i<pts.length-1;i++) R.cyl(pts[i],pts[i+1],r,col); }
const len=pts=>pts.slice(1).reduce((s,p,i)=>s+Math.hypot(p[0]-pts[i][0],p[2]-pts[i][2]),0);
function bandState(short,long){ return short?'قصيرٌ ← منقبضٌ':long?'طويلٌ ← منبسطٌ':''; }

        R.cyl(b,tp,4,'#8d93a3'); R.sphere(tp,7,'#b7bcc8'); });
    });
    R.cyl(W2(0,0,0),W2(0,0,26),17,'#9aa3b5'); R.sphere(W2(0,0,28),9,'#c7ccd8');
    R.text(W2(30,-46,30),M.mapped?'⚙️ مفصلٌ':'🔩 قطعةُ ربطٍ',{size:14});
    // inner band (between the strips)
    const a=nailPt(fA,-1,NAIL,34), b=nailPt(fB,1,NAIL,34), L=len([a,b]);

    const mid=[(a[0]+b[0])/2,40,(a[2]+b[2])/2];
    if(M.th>70) R.text(mid,M.mapped?'💪 عضلةٌ':'🔴 شريطٌ مطاطيٌّ',{size:14,dy:-14});
    const st=bandState(M.th<=60,M.th>=150); if(st) R.text(mid,st,{size:13,dy:16,bg:'#e8425a',color:'#fff'});
    if(M.out){ // outer band wraps round the hinge

      if(a1<a0) a1+=2*Math.PI;                         // go round the outside of the hinge
      for(let k=0;k<=steps;k++){ const t=a0+(a1-a0)*k/steps, d=dir2(t); pts.push(W2(d[0]*30,d[1]*30,34)); }

      const st2=bandState(M.th>=150,M.th<=60); const q=pts[Math.floor(pts.length/2)];

    }
  }});

  if(M.out){ if(M.th>=150) M.sawOpen=true; if(M.th<=50) M.sawClose=true; } Kit.ping(); });
Kit.scene(1,{title:'أجرّبُ',
  book:'<p>الأنموذجُ: شريحتانِ خشبيتانِ تربطُهما قطعةُ ربطٍ، وفي كلٍّ منهما مسمارٌ قربَ طرفِها، وبينَ المسمارينِ شريطٌ مطاطيٌّ.</p><p><b>العضلةُ</b> نسيجٌ عضليٌّ قويٌّ يحرّكُ العظامَ؛ انقباضُها وانبساطُها يحرّكانِ العظامَ.</p>',
  summary:['تتقاربُ الشريحتانِ ← يقصرُ الشريطُ ويغلظُ','عندما يقصرُ أحدُ الشريطينِ يطولُ الآخرُ','الشريحتانِ عظمانِ، قطعةُ الربطِ مفصلٌ، الشريطُ عضلةٌ'],
  steps:[
    {text:'باعِدِ الشريحتينِ: حرّكِ المنزلقَ إلى ١٨٠°', target:'#ang', check(){ return M.th>=165; },
      after:'تباعدتِ الشريحتانِ فـ<b>طالَ الشريطُ</b> وأصبحَ أرقَّ.'},
    {text:'قرِّبِ الشريحتينِ إلى أقلَّ من ٥٠°', target:'#ang', check(){ return M.th<=50; },
      after:'تقاربتِ الشريحتانِ فـ<b>قصُرَ الشريطُ</b> وأصبحَ أغلظَ.'},
    {text:'أضِفْ شريطاً خارجياً، ثمّ باعِدْ وقرِّبْ',
      body(el){ el.innerHTML='<button class="btn cyan" type="button" id="outBtn">🟣 أضِفْ شريطاً على الخارجِ</button>';
        el.querySelector('#outBtn').onclick=e=>{ M.out=true; e.target.disabled=true; e.target.textContent='✓ أُضيفَ الشريطُ الخارجيُّ'; Kit.ping(); }; },
      target:()=>!M.out?rectOf(inScene('#outBtn')):rectOf(Kit.$('#ang')),
      enter(){ M.sawOpen=M.sawClose=false; }, check(){ return M.out&&M.sawOpen&&M.sawClose; },
      after:'<b>عندما يقصرُ أحدُ الشريطينِ يطولُ الآخرُ</b>، وعندما تتباعدُ الشريحتانِ يحدثُ العكسُ.'},
    {text:'ماذا يمثّلُ كلُّ جزءٍ في الجسمِ؟ ضعْه في مكانِه',
      body(el){ sorter(el,{key:'map',cols:'zones3',
        chips:[{id:'st',t:'🪵 الشريحتانِ',z:'bone'},{id:'hj',t:'🔩 قطعةُ الربطِ',z:'joint'},{id:'rb',t:'🔴 الشريطُ',z:'muscle'}],
        zones:[{z:'bone',t:'🦴 عظمانِ'},{z:'joint',t:'⚙️ مفصلٌ'},{z:'muscle',t:'💪 عضلةٌ'}],
        why:{st:'الشريحتانِ قطعتانِ صلبتانِ تتحرّكانِ — ماذا يشبهُهما في الجسمِ؟',hj:'قطعةُ الربطِ تربطُ الشريحتينِ — ما الذي يربطُ عظمينِ؟',rb:'الشريطُ يقصرُ ويطولُ — أيُّ جزءٍ ينقبضُ وينبسطُ؟'},
        solution:'الشريحتانِ = عظمانِ، قطعةُ الربطِ = مفصلٌ، الشريطُ = عضلةٌ.'}); },
      target:'.chip:not(.ok)', check(){ const ok=document.querySelectorAll('.scene.on .g-body .chip.ok').length===3; if(ok) M.mapped=true; return ok; },
      after:'الشريحتانِ = <b>عظمانِ</b>، قطعةُ الربطِ = <b>مفصلٌ</b>، الشريطُ = <b>عضلةٌ</b> تنقبضُ وتنبسطُ.'}
  ]});

/* ================= Scene 3: the arm + voluntary / involuntary ================= */
const A={bend:0, s:0, raised:false, heartTry:false, hasMoved:false};
const SH=[-60,130];
const rot2=(v,deg)=>{ const a=deg*Math.PI/180, c=Math.cos(a), s=Math.sin(a); return [v[0]*c-v[1]*s, v[0]*s+v[1]*c]; };
const add2=(a,b)=>[a[0]+b[0],a[1]+b[1]];
const W3=(p,z=0)=>[p[0],p[1],z];
const musM=Kit.mesh.ellipsoid({rx:1,ry:1,rz:1,seg:18,ring:12});
const heartM=Kit.mesh.ellipsoid({rx:34,ry:38,rz:28,seg:18,ring:12,bump:(u,v)=>1+.18*Math.max(0,Math.cos(u*Math.PI*4))*Math.sin(v*Math.PI)*(v<.5?1:0)});
function armPts(){ const b=A.bend*1.3, E=add2(SH,rot2([0,-170],A.s)), H=add2(E,rot2([0,-160],A.s+b));
  const T1=add2(SH,rot2([18,-28],A.s)), T2=add2(E,rot2([15,-38],A.s+b)); return {E,H,T1,T2}; }
const v2=Kit.view3d(Kit.$('#view2'),{yaw:.3,pitch:.15,zoom:1.05,
  draw(R){
    const now=performance.now(), {E,H,T1,T2}=armPts();
    // heart (keeps beating)
    const beat=Kit.reduced?0:Math.pow(Math.max(0,Math.sin(now/1000*Math.PI*2*1.15)),6), hs=1+.12*beat;
    R.mesh(heartM,{pos:[-250,-30,-30],rot:[0,0,.45],scale:hs},{color:'#e8425a'}); R.cyl([-240,5,-30],[-225,40,-30],9,'#c22b43');
    R.text([-250,-92,-30],'💓 القلبُ',{size:14});
    // bones
    R.sphere(W3(SH),24,BONE); R.cyl(W3(SH),W3(E),17,BONE);
    R.cyl(W3(E,-22),W3(E,22),20,BONE2); R.cyl(W3(E),W3(H),14,BONE); R.sphere(W3(H),20,'#f2c9a0');
    // muscle with tendons
    const d=[T2[0]-T1[0],T2[1]-T1[1]], dl=Math.hypot(d[0],d[1]), n=[d[0]/dl,d[1]/dl];
    const M1=add2(T1,[n[0]*18,n[1]*18]), M2=add2(T2,[-n[0]*18,-n[1]*18]), L=Math.hypot(M2[0]-M1[0],M2[1]-M1[1]), r=clamp(2700/L,15,40);
    R.cyl(W3(T1),W3(M1),4,'#f7f2e6'); R.cyl(W3(M2),W3(T2),4,'#f7f2e6');
    const mid=[(M1[0]+M2[0])/2,(M1[1]+M2[1])/2];
    R.mesh(musM,{pos:W3(mid,4),rot:[0,0,Math.atan2(-n[0],n[1])],scale:[r,L/2,r*.9]},{color:'#e8425a'});
    // labels
    R.text(W3(add2(SH,rot2([-70,-85],A.s))),'العضدُ',{size:14});
    const calm=A.s<5; if(calm) R.text(W3(add2(E,rot2([-52,-100],A.s+A.bend*1.3))),'الساعدُ',{size:14});
    const st=A.bend>=70?'منقبضةٌ: قصيرةٌ وغليظةٌ':A.bend<=20?'منبسطةٌ: طويلةٌ ورقيقةٌ':'';
    if(calm) R.text(W3(add2(mid,[r+58,0])),'العضلةُ',{size:14,dy:st?-14:0}); if(st&&calm) R.text(W3(add2(mid,[r+58,0])),st,{size:12.5,dy:16,bg:'#e8425a',color:'#fff'});
    if(A.hasMoved&&calm) R.text(W3(add2(T2,[40,-6])),'الوترُ',{size:13,bg:'#f7f2e6'});
    if(now-A.heartT<1800) R.text([-250,50,-30],'✋ لم يتوقّفْ!',{size:15,bg:'#f6a723'});
  }});
A.heartT=0;
const bend=Kit.$('#bend');
function setBend(v){ A.bend=v; bend.value=v; Kit.$('#bendOut').textContent=v>=70?'مثنيّةٌ':v<=20?'ممدودةٌ':Kit.ar(v)+'٪'; Kit.ping(); }
bend.addEventListener('input',()=>setBend(+bend.value));
function animS(to,ms,done){ if(Kit.reduced){ A.s=to; done&&done(); return; } const from=A.s, t0=performance.now();
  (function f(now){ const k=Math.min(1,(now-t0)/ms); A.s=from+(to-from)*(1-Math.pow(1-k,3)); if(k<1) requestAnimationFrame(f); else done&&done(); })(t0); }
Kit.scene(2,{title:'أتحدّى',
  book:'<p>يؤدّي <b>انقباضُ العضلاتِ وانبساطُها</b> إلى حركةِ العظامِ. العضلاتُ الإراديةُ ترتبطُ بالعظامِ بالأوتارِ ونتحكّمُ فيها؛ أمّا اللاإراديةُ (القلبُ، المعدةُ) فلا نتحكّمُ فيها.</p><p>الجهازُ الهيكليُّ + الجهازُ العضليُّ = <b>الجهازُ الحركيُّ</b>.</p>',
  summary:['انقباضُ العضلةِ وانبساطُها يحرّكانِ العظامَ','الوترُ يربطُ العضلةَ بالعظمِ','إراديةٌ: الذراعُ والساقُ · لاإراديةٌ: القلبُ والمعدةُ'],
  steps:[
    {text:'اثنِ الذراعَ تماماً وراقبِ <b>العضلةَ</b>', target:'#bend', check(){ return A.bend>=95; },
      after:'<b>انقبضتِ العضلةُ</b>: قصُرتْ وانتفختْ، فسحبتِ الساعدَ بالوترِ.'},
    {text:'مُدَّ الذراعَ تماماً', target:'#bend', enter(){ A.hasMoved=true; }, check(){ return A.bend<=5; },
      after:'<b>انبسطتِ العضلةُ</b>: طالتْ ورقّتْ، فامتدّتِ الذراعُ.'},
    {text:'جرّبِ الأمرينِ: ارفعْ ذراعَك، وأوقفْ قلبَك',
      body(el){ el.innerHTML='<div class="cmds"><button class="btn" type="button" id="cmdArm">🙋 ارفعْ ذراعَك</button><button class="btn red" type="button" id="cmdHeart">✋ أوقفْ قلبَك</button></div>';
        el.querySelector('#cmdArm').onclick=()=>{ animS(80,700,()=>{ A.raised=true; Kit.say('🙋 ارتفعتِ الذراعُ كما أردتَ: عضلاتُها <b>إراديةٌ</b>.','ok'); Kit.ping(); setTimeout(()=>animS(0,700),1200); }); };
        el.querySelector('#cmdHeart').onclick=()=>{ A.heartTry=true; A.heartT=performance.now(); Kit.say('✋ لم يتوقّفِ القلبُ، ما زالَ ينبضُ وحدَه: عضلاتُه <b>لاإراديةٌ</b>.','warn'); Kit.ping(); }; },
      target:()=>rectOf(inScene(A.raised?'#cmdHeart':'#cmdArm')), enter(){ A.raised=false; A.heartTry=false; },
      check(){ return A.raised&&A.heartTry; },
      after:'الذراعُ تتحرّكُ بأمرِك: عضلاتُها <b>إراديةٌ</b>. القلبُ ينبضُ وحدَه: عضلاتُه <b>لاإراديةٌ</b>.'},
    {text:'صنِّفِ العضلاتِ: إراديةٌ أم لاإراديةٌ؟',
      body(el){ sorter(el,{key:'vol',cols:'zones2',
        chips:[{id:'h',t:'❤️ القلبُ',z:'inv'},{id:'s',t:'🍽️ المعدةُ',z:'inv'},{id:'a',t:'💪 الذراعُ',z:'vol'},{id:'l',t:'🦵 الساقُ',z:'vol'}],
        zones:[{z:'vol',t:'🙋 إراديةٌ (نتحكّمُ فيها)'},{z:'inv',t:'💓 لاإراديةٌ (لا نتحكّمُ فيها)'}],
        why:{h:'هل استطعتَ إيقافَ القلبِ بأمرِك؟',s:'المعدةُ عضوٌ داخليٌّ — هل تتحرّكُ بأمرِك؟',a:'الذراعُ ارتفعتْ عندما أمرتَها — فهي…؟',l:'الساقُ تتحرّكُ بأمرِك — فهي…؟'},
        solution:'الذراعُ والساقُ إراديةٌ، القلبُ والمعدةُ لاإراديةٌ.'}); },
      target:'.chip:not(.ok)', check(){ return document.querySelectorAll('.scene.on .g-body .chip.ok').length===4; },
      after:'<b>الإراديةُ</b> ترتبطُ بالعظامِ بالأوتارِ ونتحكّمُ فيها، و<b>اللاإراديةُ</b> في الأعضاءِ الداخليةِ لا نتحكّمُ فيها.'}
  ]});

Kit.start();
</script>
