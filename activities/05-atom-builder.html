<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أبني ذرّتي</title>
<style>
:root{
  --navy:#200058; --muted:#5f5a85; --ink:#200058;
  --cyan:#00c3fe; --cyan-d:#0a8fc0; --cyan-l:#e3f8ff; --cyan-b:#b8ebff;
  --green:#12a06a; --green-d:#0b7a50; --green-l:#e4f6ee; --green-b:#9cd9bd;
  --red:#e8425a; --red-d:#c22b43; --red-l:#fde8ec; --red-b:#f5b3bf;
  --yellow:#ffd15c; --orange:#f6a723; --yellow-l:#fff6dc;
  --purple:#7b5cff; --purple-l:#efeaff;
  --bg:#f1f0fb; --bg-2:#e3f8ff; --card:#fff; --line:#e0ddf0; --soft:#faf9fe;
  --sh:0 6px 18px rgba(32,0,88,.08); --sh-l:0 18px 50px rgba(32,0,88,.16);
  --font:"Segoe UI","Noto Sans Arabic","Noto Naskh Arabic","Geeza Pro","Arial",Tahoma,system-ui,sans-serif;
  --nav-h:68px;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;min-height:100vh;font-family:var(--font);color:var(--ink);line-height:1.65;
  background:linear-gradient(180deg,var(--bg) 0%,var(--bg-2) 100%) fixed;}
button,input{font-family:inherit;color:inherit;}
:focus-visible{outline:3px solid var(--cyan);outline-offset:3px;border-radius:8px;}

/* ---------- header: title + 3 scene pills ---------- */
.hdr{max-width:1180px;margin:0 auto;padding:12px 16px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.hdr h1{margin:0;font-size:clamp(19px,2.6vw,25px);font-weight:900;line-height:1.3;flex:1;min-width:180px;}
.ref{font-size:12.5px;font-weight:700;color:var(--cyan-d);background:var(--cyan-l);border:1.5px solid var(--cyan-b);border-radius:999px;padding:4px 12px;white-space:nowrap;}
.pills{display:flex;gap:6px;list-style:none;margin:0;padding:0;}
.pills li{display:flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:999px;font-weight:800;font-size:14px;
  background:#fff;border:2px solid var(--line);color:var(--muted);transition:all .25s;white-space:nowrap;}
.pills li b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-size:13px;}
.pills li.on{border-color:var(--navy);color:var(--navy);box-shadow:0 0 0 3px rgba(32,0,88,.08);}
.pills li.on b{background:var(--navy);color:#fff;}
.pills li.done{border-color:var(--green-b);color:var(--green-d);}
.pills li.done b{background:var(--green);color:#fff;}

/* ---------- scene layout ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:12px 16px calc(var(--nav-h) + 18px);}
.scene{display:none;}
.scene.on{display:block;animation:rise .35s ease both;}
.layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:16px;align-items:start;}
.viewport{position:relative;border-radius:24px;overflow:hidden;background:#fff;box-shadow:var(--sh-l);min-height:420px;}
.viewport.dark{background:radial-gradient(ellipse at 50% 38%,#33197a 0%,#170040 72%);}
.v3d{position:relative;width:100%;aspect-ratio:4/3;touch-action:none;cursor:grab;}
.v3d canvas{display:block;width:100%;height:100%;}
.v3d .rot{position:absolute;bottom:10px;inset-inline-start:10px;font-size:12.5px;font-weight:800;color:#e8e3ff;background:rgba(255,255,255,.12);
  border-radius:999px;padding:4px 12px;pointer-events:none;}
.viewport:not(.dark) .v3d .rot{color:var(--muted);background:rgba(32,0,88,.06);}
.vtools{position:absolute;top:10px;inset-inline-end:10px;display:flex;gap:6px;z-index:3;flex-wrap:wrap;justify-content:flex-end;}

/* ---------- the guide card (one place to look) ---------- */
.guide{background:#fff;border-radius:24px;box-shadow:var(--sh-l);padding:16px 16px 14px;position:sticky;top:12px;}
.g-trail{display:flex;gap:6px;align-items:center;margin-bottom:10px;}
.g-trail i{flex:1;height:8px;border-radius:99px;background:#ece9f8;transition:background .3s;}
.g-trail i.done{background:var(--green);} .g-trail i.cur{background:var(--cyan);}
.g-count{font-size:13px;font-weight:800;color:var(--muted);margin-bottom:4px;}
.g-step{display:flex;gap:12px;align-items:flex-start;}
.g-num{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--navy);color:#fff;font-weight:900;font-size:20px;}
.g-text{margin:0;font-size:clamp(18px,2.1vw,21px);font-weight:900;line-height:1.45;padding-top:6px;}
.g-body{margin-top:12px;}
.g-body:empty{display:none;}
.g-book{margin-top:12px;border-top:1.5px dashed var(--line);padding-top:8px;}
.g-book summary{cursor:pointer;font-weight:800;font-size:14px;color:var(--purple);list-style:none;min-height:36px;display:flex;align-items:center;gap:6px;}
.g-book summary::-webkit-details-marker{display:none;}
.g-book p{margin:6px 0 0;font-size:15px;background:var(--purple-l);border-radius:12px;padding:8px 12px;}
.g-book .extra{background:var(--soft);color:var(--muted);font-size:13.5px;border:1.5px dashed var(--line);}
.g-book .extra::before{content:"ℹ️ توضيحٌ للنشاطِ وليس من الكتابِ: ";font-weight:800;}
.g-done{text-align:center;padding:8px 0 2px;}
.g-done .big{font-size:44px;line-height:1;animation:pop .5s ease both;}
.g-done h3{margin:6px 0 4px;font-size:21px;font-weight:900;}
.g-done ul{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:6px;text-align:start;}
.g-done li{background:var(--green-l);border:1.5px solid var(--green-b);border-radius:12px;padding:7px 12px;font-weight:700;font-size:15px;}

/* ---------- controls ---------- */
.btn{min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 20px;border-radius:999px;border:2px solid transparent;
  font-size:16px;font-weight:800;cursor:pointer;background:var(--navy);color:#fff;transition:transform .12s,background .2s,box-shadow .2s;touch-action:manipulation;user-select:none;}
.btn:active{transform:scale(.96);} .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
.btn.cyan{background:var(--cyan);color:var(--navy);} .btn.green{background:var(--green);} .btn.red{background:var(--red);}
.btn.ghost{background:#fff;color:var(--navy);border-color:var(--line);}
.btn.ghost[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy);}
.btn.sm{min-height:40px;font-size:14.5px;padding:0 14px;}
.btn.glow{animation:glow 1.4s ease-in-out infinite;}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.choices{display:grid;gap:8px;}
.choice{min-height:52px;text-align:start;padding:8px 14px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:16.5px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:10px;}
.choice:hover{border-color:var(--cyan);}
.choice.ok{border-color:var(--green);background:var(--green-l);} .choice.bad{border-color:var(--red);background:var(--red-l);animation:shake .4s;}
.counter{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--soft);border:1.5px solid var(--line);border-radius:16px;padding:6px 8px 6px 12px;}
.counter .n{font-size:24px;font-weight:900;min-width:34px;text-align:center;}
input[type=range]{width:100%;height:44px;accent-color:var(--cyan-d);cursor:pointer;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{min-height:46px;display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;background:#fff;border:2px solid var(--cyan-b);
  font-weight:800;font-size:15.5px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 3px 0 var(--cyan-b);}
.chip.sel{border-color:var(--navy);box-shadow:0 0 0 4px rgba(0,195,254,.35);}
.chip.dragging{opacity:.35;} .chip.ghost{position:fixed;z-index:999;pointer-events:none;transform:rotate(-3deg) scale(1.05);box-shadow:var(--sh-l);}
.chip.ok{border-color:var(--green);background:var(--green-l);box-shadow:0 3px 0 var(--green-b);cursor:default;} .chip.bad{border-color:var(--red);background:var(--red-l);animation:shake .4s;}
.zone{min-height:62px;border:2.5px dashed var(--cyan-b);border-radius:16px;padding:8px;background:#fff;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;transition:background .15s,border-color .15s;}
.zone.hot{background:var(--cyan-l);border-color:var(--cyan);border-style:solid;}
.zone .zt{width:100%;font-weight:900;font-size:15px;}
.tag{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:14px;border-radius:999px;padding:3px 12px;background:var(--soft);border:1.5px solid var(--line);}
.tag.ok{background:var(--green-l);border-color:var(--green-b);color:var(--green-d);} .tag.bad{background:var(--red-l);border-color:var(--red-b);color:var(--red-d);}

/* feedback (inside the guide card) */
.fb{display:none;margin-top:10px;border-radius:14px;padding:10px 12px;font-size:15.5px;font-weight:700;border:2px solid;animation:rise .25s ease both;}
.fb.show{display:flex;gap:8px;align-items:flex-start;}
.fb .ic{font-size:20px;line-height:1.3;flex:none;}
.fb.ok{background:var(--green-l);border-color:var(--green-b);color:#064b31;}
.fb.bad{background:var(--red-l);border-color:var(--red-b);color:#7a1426;}
.fb.info{background:var(--cyan-l);border-color:var(--cyan-b);color:#06456a;}
.fb.warn{background:var(--yellow-l);border-color:#f3dc97;color:#5a4200;}

/* spotlight ring + pointing hand */
#spot{position:fixed;z-index:60;pointer-events:none;border-radius:50%;border:4px solid var(--yellow);box-shadow:0 0 0 6px rgba(255,209,92,.35),0 0 24px rgba(255,209,92,.8);
  display:none;animation:ring 1.3s ease-in-out infinite;transition:left .25s,top .25s,width .25s,height .25s;}
#spot.box{border-radius:18px;}
#hand{position:fixed;z-index:61;pointer-events:none;font-size:34px;display:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3));animation:tapme 1.3s ease-in-out infinite;transition:left .25s,top .25s;}

/* nav */
.navbar{position:fixed;bottom:0;left:0;right:0;z-index:50;height:var(--nav-h);background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-top:1.5px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));}
.navbar .in{max-width:1180px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:space-between;height:100%;}
.navbar .where{font-weight:800;color:var(--muted);font-size:14px;text-align:center;flex:1;}

.confetti{position:fixed;inset:0;pointer-events:none;z-index:998;}
@keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
@keyframes shake{0%,100%{transform:none;}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
@keyframes pop{0%{transform:scale(.5);opacity:0;}70%{transform:scale(1.12);}100%{transform:scale(1);opacity:1;}}
@keyframes ring{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.12);opacity:.75;}}
@keyframes tapme{0%,100%{transform:translate(0,0);}50%{transform:translate(-4px,-8px);}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(0,195,254,.6);}50%{box-shadow:0 0 0 10px rgba(0,195,254,0);}}

/* phone: one screen, no overlap — header, model (top), guide (fills the rest, scrolls inside), nav */
@media (max-width:820px){
  body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;}
  .hdr{padding:8px 10px 0;gap:8px;flex:none;} .hdr h1{font-size:18px;min-width:0;} .ref{display:none;}
  .pills li{height:34px;padding:0 9px;font-size:13px;} .pills li span{display:none;}
  .wrap{flex:1;min-height:0;width:100%;padding:8px 8px calc(var(--nav-h) + 8px);}
  .scene.on{height:100%;}
  .layout{display:flex;flex-direction:column;height:100%;gap:8px;align-items:stretch;}
  .viewport{flex:0 0 auto;min-height:0;border-radius:18px;}
  .v3d{aspect-ratio:auto;height:36vh;height:36dvh;min-height:200px;}
  .guide{position:static;flex:1 1 0;min-height:140px;overflow:auto;border-radius:18px;padding:12px;}
  .g-num{width:38px;height:38px;font-size:18px;border-radius:12px;} .g-text{font-size:17.5px;padding-top:4px;}
  .g-count{display:none;}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}}
</style>
<style>
/* ===== ACTIVITY CSS ===== */
.legend{position:absolute;top:10px;inset-inline-end:10px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
.legend span{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:800;color:#fff;background:rgba(255,255,255,.12);border-radius:999px;padding:3px 10px 3px 6px;}
.dot{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-style:normal;font-weight:900;font-size:13px;color:#fff;flex:none;}
.dot.p{background:#e8425a;} .dot.n{background:#12a06a;} .dot.e{background:#ffd15c;color:#3a2a00;}
.charge{font-size:15px;font-weight:900;border-radius:999px;padding:6px 14px;background:rgba(255,255,255,.14);color:#fff;}
.charge.neu{background:#12a06a;} .charge.pos{background:#e8425a;} .charge.neg{background:#f6a723;color:#3a2a00;}
.bench{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:10px;background:#fff;}
.bench .counter{flex-wrap:nowrap;padding:6px;}
.bench .lbl{display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px;flex:1;justify-content:center;}
.bench .counter .n{font-size:22px;min-width:26px;}
.bench .btn.sm{min-width:44px;padding:0;}
@media (max-width:820px){
  .bench{gap:6px;padding:6px;}
  .bench .counter{display:grid;grid-template-columns:1fr auto 1fr;grid-template-areas:"l l l" "m n p";padding:4px;gap:2px;justify-items:center;}
  .bench .lbl{grid-area:l;font-size:12.5px;} .bench .counter [data-d="-1"]{grid-area:m;} .bench .counter .n{grid-area:n;font-size:19px;} .bench .counter [data-d="1"]{grid-area:p;}
  .bench .btn.sm{min-height:38px;min-width:38px;} .bench .dot{width:18px;height:18px;font-size:11px;}
  #view1{height:27vh;height:27dvh;min-height:170px;} .legend span{font-size:11.5px;}
}
</style>
</head>
<body>
<header class="hdr">
  <h1>⚛️ أبني ذرّتي</h1>
  <span class="ref">📘 الفصلُ ٥ · الدرسُ ١: الذرةُ · كتابُ النشاطِ ص ٣٧–٣٩</span>
  <ol class="pills" id="pills" aria-label="أجزاءُ النشاطِ"></ol>
</header>

<div class="wrap">
  <section class="scene" data-scene="0">
    <div class="layout">
      <div class="viewport dark"><div class="v3d" id="view0"></div>
        <div class="legend"><span><i class="dot p">+</i>بروتونٌ</span><span><i class="dot n">n</i>نيوترونٌ</span><span><i class="dot e">−</i>إلكترونٌ</span></div>
      </div>
      <aside class="guide"></aside>
    </div>
  </section>

  <section class="scene" data-scene="1">
    <div class="layout">
      <div class="viewport dark"><div class="v3d" id="view1"></div>
        <div class="vtools"><span class="charge" id="charge">لا جسيماتِ بعدُ</span></div>
        <div class="bench" id="bench">
          <div class="counter" data-k="p"><button class="btn sm ghost" data-d="-1" aria-label="أزلْ بروتوناً">−</button><span class="lbl"><i class="dot p">+</i>بروتوناتٌ</span><span class="n">٠</span><button class="btn sm" data-d="1" aria-label="أضفْ بروتوناً">+</button></div>
          <div class="counter" data-k="n"><button class="btn sm ghost" data-d="-1" aria-label="أزلْ نيوتروناً">−</button><span class="lbl"><i class="dot n">n</i>نيوتروناتٌ</span><span class="n">٠</span><button class="btn sm" data-d="1" aria-label="أضفْ نيوتروناً">+</button></div>
          <div class="counter" data-k="e"><button class="btn sm ghost" data-d="-1" aria-label="أزلْ إلكتروناً">−</button><span class="lbl"><i class="dot e">−</i>إلكتروناتٌ</span><span class="n">٠</span><button class="btn sm" data-d="1" aria-label="أضفْ إلكتروناً">+</button></div>
        </div>
      </div>
      <aside class="guide"></aside>
    </div>
  </section>

  <section class="scene" data-scene="2">
    <div class="layout">
      <div class="viewport dark"><div class="v3d" id="view2"></div>
        <div class="vtools"><span class="charge" id="cmpTag" hidden></span></div>
      </div>
      <aside class="guide"></aside>
    </div>
  </section>
</div>

<nav class="navbar" aria-label="التنقلُ">
  <div class="in">
    <button class="btn ghost" id="prevBtn" type="button">→ السابقُ</button>
    <div class="where" id="where"></div>
    <button class="btn" id="nextBtn" type="button">التالي ←</button>
  </div>
</nav>
<div id="spot" aria-hidden="true"></div><div id="hand" aria-hidden="true">👆</div>

<script>
/* =====================================================================
   KIT v2
   Scenes & guided steps:
     Kit.scene(i, { title:'أستكشفُ', book:'<p>…</p><p class="extra">…</p>', summary:['…'], steps:[ STEP, … ] })
     STEP = { text:'اضغطْ على النواةِ', target: '#sel' | element | ()=>({x,y,r}) (client coords) | null,
              body: html string | (el)=>{} , enter(){}, check(){ return true when done }, after:'feedback html shown when done' }
     Kit.start()            begin
     Kit.ping()             re-check current step now (call after any state change)
     Kit.next()             force-advance current step
     Kit.say(html,type)     feedback in the current guide card ('ok'|'bad'|'info'|'warn')
     Kit.tries(key)         counts wrong tries; returns the count (use to reveal "أرني الحلَّ" after 2)
   3D:
     const V = Kit.view3d(el, { draw(R,t){…}, onPick(id,hit){…}, yaw, pitch, zoom, auto:false, dist })
       R.sphere([x,y,z], r, '#hex', {id, label, labelColor, alpha})
       R.cyl([x,y,z],[x,y,z], r, '#hex', {id, alpha})          (rod / bond / bone)
       R.mesh(mesh, {pos,rot,scale}, {id, color:'#hex'|fn(c,n), alpha, doubleSided})
       R.line(a,b,'#hex',width,{dash,glow})   R.poly([p…],'#hex',width,{closed,dash,glow})   R.text(p,'نص',{color,size,bg})
       R.shadow([x,y,z], rx, rz)
       V.screen([x,y,z]) -> client {x,y}   V.cam (yaw,pitch,zoom)   V.redraw()
     Kit.mesh.ellipsoid({rx,ry,rz,seg,ring, bump:(u,v)=>k})  Kit.mesh.surface(fn(u,v)->[x,y,z], uSeg, vSeg, {closedU})
     Kit.mesh.box(w,h,d)   Kit.mesh.lathe(profile[[r,y]…], seg)
   Misc: Kit.ar(n) Arabic digits · Kit.dnd({chips,zones,accept,onDrop}) · Kit.celebrate() · Kit.toast(msg) · Kit.reduced
   ===================================================================== */
const Kit = (() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = (s, r=document) => r.querySelector(s), $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
  const AR='٠١٢٣٤٥٦٧٨٩', ar = n => String(n).replace(/[0-9]/g, d => AR[d]);
  const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };

  /* ---------------- scenes + guided steps ---------------- */
  const S=[]; let cur=0, step=0, timer=null, advancing=false; const tryCount={};
  function scene(i,cfg){ S[i]=Object.assign({done:false},cfg); }
  function start(){
    const pills=$('#pills'); pills.innerHTML='';
    S.forEach((s,i)=>{ const li=document.createElement('li'); li.innerHTML='<b>'+ar(i+1)+'</b><span>'+s.title+'</span>'; li.title=s.title; pills.appendChild(li); });
    $('#prevBtn').onclick=()=>goScene(cur-1); $('#nextBtn').onclick=()=>goScene(cur+1);
    addEventListener('resize',placeSpot); addEventListener('scroll',placeSpot,{passive:true});
    (function spotLoop(){ placeSpot(); requestAnimationFrame(spotLoop); })();
    goScene(0,true);
  }
  function goScene(i,first){
    if(i<0||i>=S.length) return;
    if(!first && i>cur && !S[cur].done){ toast('أكملْ خطواتِ هذا الجزءِ أولاً 👆'); return; }
    cur=i; $$('.scene').forEach((el,k)=>el.classList.toggle('on',k===i));
    $$('#pills li').forEach((li,k)=>{ li.classList.toggle('on',k===i); li.classList.toggle('done',S[k].done&&k!==i); });
    $('#prevBtn').disabled=i===0; $('#nextBtn').style.visibility=i===S.length-1?'hidden':'visible';
    $('#where').textContent='الجزءُ '+ar(i+1)+' من '+ar(S.length);
    if(!first) scrollTo({top:0,behavior:reduced?'auto':'smooth'});
    S[i].enter&&S[i].enter();

  function celebrate(){ if(reduced) return; const c=document.createElement('canvas'); c.className='confetti'; document.body.appendChild(c); const x=c.getContext('2d'); c.width=innerWidth; c.height=innerHeight;
    const cols=['#00c3fe','#12a06a','#ffd15c','#7b5cff','#e8425a'], P=Array.from({length:70},()=>({x:innerWidth/2+(Math.random()-.5)*160,y:innerHeight*.3,vx:(Math.random()-.5)*8,vy:-Math.random()*8-3,s:5+Math.random()*5,c:cols[Math.random()*5|0],r:Math.random()*6}));
    let t=0; (function f(){ t++; x.clearRect(0,0,c.width,c.height); P.forEach(p=>{ p.vy+=.28; p.x+=p.vx; p.y+=p.vy; p.r+=.15; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); x.restore(); }); if(t<100) requestAnimationFrame(f); else c.remove(); })(); }

  return {$,$$,ar,shuffle,scene,start,ping,next,say,tries,toast,dnd,view3d,mesh,celebrate,reduced,goScene,get scene_(){return cur;},get step_(){return step;}};
})();
</script>
<script>
/* ===== ACTIVITY JS ===== */
/* ---------- atom drawing ---------- */
const COL={p:'#e8425a',n:'#12a06a',e:'#ffd15c'};
function nucleonSpots(count){            // pack nucleons in a small ball (fibonacci sphere, two shells)
  const pts=[]; if(count===1) return [[0,0,0]];
  for(let i=0;i<count;i++){ const k=i+.5, phi=Math.acos(1-2*k/count), th=Math.PI*(1+Math.sqrt(5))*k, r=13+count*1.6;
    pts.push([Math.cos(th)*Math.sin(phi)*r, Math.cos(phi)*r, Math.sin(th)*Math.sin(phi)*r]); }
  return pts;
}
const TILTS=[[0,0],[1.1,.3],[-1.1,.9],[.55,1.8],[-.55,2.5],[1.4,1.2],[-1.4,2.1],[.2,.7]];
function orbitPoint(i,count,ang,rad){ const [tx,ty]=TILTS[i%TILTS.length]; let x=Math.cos(ang)*rad, y=0, z=Math.sin(ang)*rad;
  let c=Math.cos(tx),s=Math.sin(tx); [y,z]=[y*c-z*s,y*s+z*c]; c=Math.cos(ty); s=Math.sin(ty); [x,z]=[x*c+z*s,-x*s+z*c]; return [x,y,z]; }
function orbitRadius(eCount){ return 95+eCount*16; }     // more electrons -> bigger atom (book's size rule)
function drawAtom(R,t,a,o={}){
  const C=o.c||[0,0,0], sc=o.s||1, ids=o.ids, nuc=[]; for(let i=0;i<a.p;i++) nuc.push('p'); for(let i=0;i<a.n;i++) nuc.push('n');
  // interleave so colours mix
  nuc.sort((x,y)=>0); const mix=[]; let pi=0,ni=0; while(pi<a.p||ni<a.n){ if(pi<a.p){mix.push('p');pi++;} if(ni<a.n){mix.push('n');ni++;} }
  nucleonSpots(mix.length).forEach((q,i)=>R.sphere([C[0]+q[0]*sc,C[1]+q[1]*sc,C[2]+q[2]*sc],13*sc,COL[mix[i]],{id:ids?'nuc':null,label:mix[i]==='p'?'+':'n'}));
  const rad=orbitRadius(o.eForSize??a.e)*sc;
  for(let i=0;i<a.e;i++){
    const ring=[]; for(let k=0;k<=48;k++) ring.push(orbitPoint(i,a.e,k/48*Math.PI*2,rad).map((v,j)=>v+C[j]));
    R.poly(ring,'rgba(255,224,140,.45)',1.4,{});
    const ang=(t/1000)*(.9+i*.13)*(Kit.reduced?0:1)+i*2.1+(a.flyIdx===i?0:0);
    let p=orbitPoint(i,a.e,ang,rad).map((v,j)=>v+C[j]);
    if(a.fly!=null && i===a.e-1){ const k=a.fly; p=p.map(v=>v*(1+k*3)); }
    R.sphere(p,7*sc,COL.e,{id:ids?'e'+i:null,label:'−',labelColor:'#3a2a00'});
  }
}
const ui=n=>Kit.ar(n);

/* ================= Scene 1: explore helium ================= */
let picked={nuc:false,e:false}, startYaw=null, v0;
v0=Kit.view3d(Kit.$('#view0'),{yaw:.4,pitch:.35,zoom:1.15,
  draw(R,t){ drawAtom(R,t,{p:2,n:2,e:2},{ids:true}); },
  onPick(id){ if(!id) return; if(id==='nuc'){ picked.nuc=true; } if(id[0]==='e'){ picked.e=true; } }});
function e0screen(){ const t=performance.now(), ang=(t/1000)*.9*(Kit.reduced?0:1); return v0.screen(orbitPoint(0,2,ang,orbitRadius(2))); }
Kit.scene(0,{title:'أستكشفُ',
  book:'<p>تتكوّنُ الذرةُ من <b>النواةِ</b> و<b>الإلكتروناتِ</b>. النواةُ في المركزِ، شحنتُها موجبةٌ، وفيها البروتوناتُ (موجبةٌ) والنيوتروناتُ (متعادلةٌ). الإلكتروناتُ سالبةٌ وتدورُ حولَ النواةِ.</p><p>هذه ذرةُ الهيليومِ: بروتونانِ ونيوترونانِ، ويدورُ حولَها إلكترونانِ.</p><p class="extra">النموذجُ مكبَّرٌ جداً، والإلكتروناتُ تتحرّكُ هنا ببطءٍ لنراها.</p>',
  summary:['النواةُ في مركزِ الذرةِ وشحنتُها موجبةٌ','الإلكتروناتُ سالبةٌ وتدورُ حولَ النواةِ'],
  steps:[
    {text:'دوِّرِ الذرةَ بإصبعِك 👆', target:()=>{ const b=Kit.$('#view0').getBoundingClientRect(); return {x:b.left+b.width*.5,y:b.top+b.height*.5,r:60}; },
      enter(){ startYaw=v0.cam.yaw; }, check(){ return Math.abs(v0.cam.yaw-startYaw)>0.7; }, after:'هذه ذرةُ الهيليومِ تراها من كلِّ الجهاتِ.'},
    {text:'اضغطْ على <b>النواةِ</b> في الوسطِ', target:()=>{ const s=v0.screen([0,0,0]); return {x:s.x,y:s.y,r:42}; },
      enter(){ picked.nuc=false; }, check(){ return picked.nuc; },
      after:'النواةُ في <b>مركزِ</b> الذرةِ، شحنتُها <b>موجبةٌ</b>، وفيها <b>معظمُ كتلةِ</b> الذرةِ. فيها بروتوناتٌ <b style="color:#e8425a">+</b> ونيوتروناتٌ <b style="color:#12a06a">n</b>.'},
    {text:'اضغطْ على <b>كرةٍ صفراءَ</b> تدورُ', target:()=>{ const s=e0screen(); return {x:s.x,y:s.y,r:24}; },
      enter(){ picked.e=false; }, check(){ return picked.e; },
      after:'هذا <b>إلكترونٌ</b>: شحنتُه <b>سالبةٌ</b> وكتلتُه صغيرةٌ جداً، ويدورُ حولَ النواةِ بسرعةٍ هائلةٍ.'},
    {text:'أينَ توجدُ الإلكتروناتُ؟',
      body(el){ el.innerHTML='<div class="choices"><button class="choice" data-a="0">🔴 داخلَ النواةِ</button><button class="choice" data-a="1">🟡 تدورُ حولَ النواةِ</button></div>';
        el.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{ if(b.dataset.a==='1'){ b.classList.add('ok'); Kit.$('#view0').dataset.q='1'; Kit.ping(); }
          else { b.classList.add('bad'); Kit.say('ليسَ هذا — داخلَ النواةِ البروتوناتُ والنيوتروناتُ فقط. انظرْ إلى الكراتِ الصفراءِ: أينَ تتحرّكُ؟','bad'); } }); },
      enter(){ delete Kit.$('#view0').dataset.q; }, check(){ return Kit.$('#view0').dataset.q==='1'; }, after:'صحيحٌ! الإلكتروناتُ <b>خارجَ</b> النواةِ وتدورُ حولَها.'}
  ]});

/* ================= Scene 2: build ================= */
const A={p:0,n:0,e:0,fly:null};
const v1=Kit.view3d(Kit.$('#view1'),{yaw:.5,pitch:.35,zoom:1.05, draw(R,t){
  if(!A.p&&!A.n&&!A.e) R.text([0,0,0],'أضِفْ جسيماتٍ بالأزرارِ ⬇️',{size:16,bg:'rgba(255,255,255,.14)',color:'#fff'});
  drawAtom(R,t,A); }});
function refresh(){
  Kit.$$('#bench .counter').forEach(c=>c.querySelector('.n').textContent=ui(A[c.dataset.k]));
  const tag=Kit.$('#charge'), d=A.p-A.e;
  if(!A.p&&!A.n&&!A.e){ tag.className='charge'; tag.textContent='لا جسيماتِ بعدُ'; }
  else if(d===0){ tag.className='charge neu'; tag.textContent='⚖️ متعادلةٌ  (+'+ui(A.p)+' / −'+ui(A.e)+')'; }
  else if(d>0){ tag.className='charge pos'; tag.textContent='➕ موجبةٌ  (+'+ui(A.p)+' / −'+ui(A.e)+')'; }
  else { tag.className='charge neg'; tag.textContent='➖ سالبةٌ  (+'+ui(A.p)+' / −'+ui(A.e)+')'; }
  Kit.ping();
}
Kit.$$('#bench .counter').forEach(c=>c.querySelectorAll('button').forEach(b=>b.onclick=()=>{
  const k=c.dataset.k, nv=Math.max(0,Math.min(8,A[k]+ +b.dataset.d));
  if(k==='e' && nv<A[k] && !Kit.reduced){ A.fly=0; const t0=performance.now(); (function f(now){ A.fly=Math.min(1,(now-t0)/500); if(A.fly<1) requestAnimationFrame(f); else { A.fly=null; A.e=nv; refresh(); } })(t0); return; }
  A[k]=nv; refresh(); }));
const counterRect=k=>Kit.$('#bench .counter[data-k="'+k+'"]');
Kit.scene(1,{title:'أبني',
  book:'<p>الذرةُ <b>متعادلةٌ</b> لأنَّ عددَ الإلكتروناتِ يساوي عددَ البروتوناتِ. ذرةُ الهيدروجينِ: إلكترونٌ واحدٌ وبروتونٌ واحدٌ.</p>',
  summary:['متعادلةٌ: الإلكتروناتُ = البروتوناتِ','إذا فقدتِ الذرةُ إلكتروناً تصبحُ موجبةً'],
  steps:[
    {text:'ابنِ <b>نواةَ الهيليومِ</b>: بروتونانِ ونيوترونانِ', target:'#bench .counter[data-k="p"]',
      enter(){ /* keep whatever is there */ }, check(){ return A.p===2&&A.n===2; }, after:'نواةٌ جاهزةٌ! بروتونانِ <b>+</b> ونيوترونانِ <b>n</b>. شحنتُها موجبةٌ.'},
    {text:'أضِفْ <b>إلكترونينِ</b> يدورانِ حولَها', target:'#bench .counter[data-k="e"]',
      check(){ return A.p===2&&A.n===2&&A.e===2; }, after:'ذرةُ هيليومٍ! انظرْ إلى الشارةِ: <b>متعادلةٌ</b> — شحنتانِ موجبتانِ وشحنتانِ سالبتانِ.'},
    {text:'ماذا لو <b>فقدتِ</b> الذرةُ إلكتروناً؟ أزِلْ واحداً', target:'#bench .counter[data-k="e"] [data-d="-1"]',
      check(){ return A.p===2&&A.e===1&&A.fly==null; }, after:'أصبحتْ <b>موجبةً</b>: البروتوناتُ (٢) أكثرُ من الإلكتروناتِ (١).'},
    {text:'ابنِ ذرةَ <b>الهيدروجينِ</b> كما في الكتابِ: بروتونٌ واحدٌ وإلكترونٌ واحدٌ', target:'#bench',
      body:'<p style="margin:0;color:var(--muted);font-weight:700">💡 النيوتروناتُ: صفرٌ، كما يرسمُها الكتابُ.</p>',
      check(){ return A.p===1&&A.n===0&&A.e===1; }, after:'ذرةُ هيدروجينٍ متعادلةٌ: بروتونٌ واحدٌ وإلكترونٌ واحدٌ.'}
  ]});

/* ================= Scene 3: challenge ================= */
const cmp={show:false};
const v2=Kit.view3d(Kit.$('#view2'),{yaw:.2,pitch:.3,zoom:.62, draw(R,t){
  drawAtom(R,t,{p:2,n:2,e:2},{c:[230,0,0]}); drawAtom(R,t,{p:8,n:8,e:8},{c:[-230,0,0],s:.85});
  R.text([230,-200,0],'أ: إلكترونانِ',{size:16}); R.text([-230,-235,0],'ب: ٨ إلكتروناتٍ',{size:16}); }});
function quiz(el,opts,good,why,bad,key){
  el.innerHTML='<div class="choices">'+opts.map((o,i)=>'<button class="choice" data-i="'+i+'">'+o+'</button>').join('')+'</div>';
  el.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{ if(+b.dataset.i===good){ b.classList.add('ok'); el.dataset.ok='1'; Kit.ping(); }
    else { b.classList.add('bad'); const n=Kit.tries(key); Kit.say(bad+(n>=2?'<br><b>الحلُّ:</b> '+opts[good]+' — '+why:''),'bad'); } });
}
Kit.scene(2,{title:'أتحدّى',
  book:'<p>تختلفُ الذراتُ في الحجمِ لاختلافِ عددِ الإلكتروناتِ: <b>كلما زادَ عددُ الإلكتروناتِ كبرَ حجمُ الذرةِ</b>. ترتيبُ الكتلةِ: الإلكترونُ &lt; البروتونُ &lt; النيوترونُ.</p><p class="extra">عددُ نيوتروناتِ الذرةِ «ب» للرسمِ فقط.</p>',
  summary:['إلكتروناتٌ أكثرُ ← ذرةٌ أكبرُ','الإلكترونُ أخفُّ الجسيماتِ والنيوترونُ أثقلُها','ذرةٌ متعادلةٌ فيها ٣ إلكتروناتٍ ← ٣ بروتوناتٍ'],
  steps:[
    {text:'أيُّ الذرتينِ <b>أكبرُ</b>؟',
      body(el){ quiz(el,['أ: الذرةُ ذاتُ الإلكترونينِ','ب: الذرةُ ذاتُ ٨ إلكتروناتٍ','لهما الحجمُ نفسُه'],1,'كلما زادَ عددُ الإلكتروناتِ كبرَ حجمُ الذرةِ.','انظرْ إلى المداراتِ: أيُّهما أوسعُ؟ تذكّرْ: الحجمُ يرتبطُ بعددِ الإلكتروناتِ.','size'); },
      check(){ return document.querySelector('.scene.on .g-body').dataset.ok==='1'; }, after:'صحيحٌ! الذرةُ «ب» أكبرُ لأنَّ فيها إلكتروناتٍ أكثرَ — مثلُ حقيبةٍ فيها كتبٌ أكثرُ.'},
    {text:'رتّبِ الجسيماتِ من <b>الأخفِّ</b> إلى <b>الأثقلِ</b>',
      body(el){ el.innerHTML='<div class="chips" id="pool"><span class="chip" data-id="n"><i class="dot n">n</i>نيوترونٌ</span><span class="chip" data-id="e"><i class="dot e">−</i>إلكترونٌ</span><span class="chip" data-id="p"><i class="dot p">+</i>بروتونٌ</span></div>'+
        '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px"><div class="zone" data-z="e"><span class="zt">١ الأخفُّ</span></div><div class="zone" data-z="p"><span class="zt">٢</span></div><div class="zone" data-z="n"><span class="zt">٣ الأثقلُ</span></div></div>';
        Kit.dnd({chips:[...el.querySelectorAll('.chip')],zones:[...el.querySelectorAll('.zone')],accept:(c,z)=>c.dataset.id===z.dataset.z,
          onDrop(c,z,ok){ if(!ok){ const m={e:'الإلكترونُ كتلتُه صغيرةٌ جداً — هو الأخفُّ.',p:'البروتونُ كتلتُه كبيرةٌ، والنيوترونُ أكبرُ منه بقليلٍ.',n:'النيوترونُ أكبرُ كتلةً من البروتونِ بمقدارٍ ضئيلٍ — هو الأثقلُ.'}; Kit.say('حاولْ مرةً أخرى — '+m[c.dataset.id],'bad'); } }}); },
      check(){ return document.querySelectorAll('.scene.on .g-body .chip.ok').length===3; }, after:'الإلكترونُ &lt; البروتونُ &lt; النيوترونُ. لذلك معظمُ كتلةِ الذرةِ في النواةِ.'},
    {text:'ذرةٌ <b>متعادلةٌ</b> فيها ٣ إلكتروناتٍ (الليثيومُ). كم بروتوناً فيها؟',
      body(el){ quiz(el,['بروتونٌ واحدٌ','٣ بروتوناتٍ','٦ بروتوناتٍ'],1,'في الذرةِ المتعادلةِ عددُ البروتوناتِ يساوي عددَ الإلكتروناتِ.','تذكّرْ قاعدةَ التعادلِ: الشحناتُ الموجبةُ تساوي السالبةَ.','li'); },
      check(){ return document.querySelector('.scene.on .g-body').dataset.ok==='1'; }, after:'٣ بروتوناتٍ = ٣ إلكتروناتٍ، فالذرةُ متعادلةٌ.'}
  ]});

Kit.start(); refresh();
</script>
